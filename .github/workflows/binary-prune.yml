name: Direct Legacy JAR Prune - build 28

on:
  push:
    branches:
      - binary-prune/legacy
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: legacy-prune-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout binary workspace
        uses: actions/checkout@v4
        with:
          ref: binary-prune/legacy

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify untouched source JAR
        shell: bash
        run: |
          set -euo pipefail
          test -s ec_ad-forge-1.20.1-1.0.4.jar
          ORIGINAL_SHA="$(sha256sum ec_ad-forge-1.20.1-1.0.4.jar | cut -d' ' -f1)"
          test "$ORIGINAL_SHA" = "8df20e08d46f778a6e975b60b0cc7e19ff674264834812015537d7ef0fb121b1"
          echo "Immutable original input hash verified."
          echo "Original JAR SHA-256: $ORIGINAL_SHA"

      - name: Download ASM bytecode tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/tools
          curl --fail --location --retry 3 \
            https://repo.maven.apache.org/maven2/org/ow2/asm/asm/9.7.1/asm-9.7.1.jar \
            -o build/tools/asm-9.7.1.jar
          curl --fail --location --retry 3 \
            https://repo.maven.apache.org/maven2/org/ow2/asm/asm-tree/9.7.1/asm-tree-9.7.1.jar \
            -o build/tools/asm-tree-9.7.1.jar

      - name: Compile direct bytecode pruner
        shell: bash
        run: |
          set -euo pipefail
          CP="build/tools/asm-9.7.1.jar:build/tools/asm-tree-9.7.1.jar"
          javac -encoding UTF-8 -cp "$CP" -d build/tools tools/JarPruner.java

      - name: Prune classes and registrations in the original JAR
        shell: bash
        run: |
          set -euo pipefail
          CP="build/tools:build/tools/asm-9.7.1.jar:build/tools/asm-tree-9.7.1.jar"
          java -cp "$CP" JarPruner \
            ec_ad-forge-1.20.1-1.0.4.jar \
            build/classes-pruned.jar

      - name: Prune resources inside the JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/libs
          python3 tools/prune_binary_jar.py \
            build/classes-pruned.jar \
            build/libs/archie_dinosaurs-legacy-forge-1.20.1.jar

      - name: Audit original and retained mob turn controllers
        shell: bash
        run: |
          set -euo pipefail

          dump_method() {
            local jar="$1"
            local class="$2"
            local method="$3"
            echo "===== $jar :: $class :: $method ====="
            javap -classpath "$jar" -p -c "$class" | awk -v method="$method" '
              index($0, method) > 0 { capture=1 }
              capture { print }
              capture && NF == 0 { exit }
            '
          }

          ORIGINAL_JAR="ec_ad-forge-1.20.1-1.0.4.jar"
          PRUNED_JAR="build/classes-pruned.jar"

          for JAR in "$ORIGINAL_JAR" "$PRUNED_JAR"; do
            dump_method "$JAR" com.eternal_creations.archies_dino_mod.common.entity.ai.control.SmoothMoveControl 'tick3DMovement('
            dump_method "$JAR" com.eternal_creations.archies_dino_mod.common.entity.ai.control.SmoothMoveControl 'tickClimber('
            dump_method "$JAR" com.eternal_creations.archies_dino_mod.common.entity.ai.control.SmoothMoveControl 'tickWalker('
            dump_method "$JAR" com.eternal_creations.archies_dino_mod.common.entity.ai.control.SmoothMoveControl 'smoothRotlerp('
            dump_method "$JAR" com.eternal_creations.archies_dino_mod.common.entity.ai.control.SmoothBodyControl 'm_8121_('
            dump_method "$JAR" com.eternal_creations.archies_dino_mod.common.entity.ai.control.SmoothLookControl 'm_8128_('
          done

      - name: Verify retained renderer method descriptors
        shell: bash
        run: |
          set -euo pipefail
          PROVIDER_DESC='()Lcom/astemir/astemirlib/re/client/model/render/renderer/AstemirEntityRenderer$Provider;'
          for class_name in \
            com.eternal_creations.archies_dino_mod.client.model.render.entity.mob.LushsaurClient \
            com.eternal_creations.archies_dino_mod.client.model.render.entity.mob.ChorusoatlClient \
            com.eternal_creations.archies_dino_mod.client.model.render.entity.mob.SculksaurClient
          do
            javap -classpath build/classes-pruned.jar -p -s "$class_name" | grep -F "descriptor: $PROVIDER_DESC"
          done
          RENDER_CALLS="$(javap -classpath build/classes-pruned.jar -p -c com.eternal_creations.archies_dino_mod.client.CommonClient)"
          COUNT="$(printf '%s\n' "$RENDER_CALLS" | grep -F -o "createRenderProvider:$PROVIDER_DESC" | wc -l)"
          test "$COUNT" -eq 3
          if printf '%s\n' "$RENDER_CALLS" | grep -F "createRenderProvider:()Lnet/minecraft/client/renderer/entity/EntityRendererProvider;"; then
            echo "Found stale renderer descriptor in CommonClient."
            exit 1
          fi
          if ! printf '%s\n' "$RENDER_CALLS" | grep -F "m_174009_:()Lnet/minecraft/client/renderer/entity/EntityRendererProvider;"; then
            echo "Missing correctly named EntityRendererProvider lambda SAM."
            exit 1
          fi
          if printf '%s\n' "$RENDER_CALLS" | grep -F "get:()Lnet/minecraft/client/renderer/entity/EntityRendererProvider;"; then
            echo "Found invalid EntityRendererProvider lambda SAM name."
            exit 1
          fi
          EGG_RENDERER_DESC='(Lcom/astemir/astemirlib/re/client/model/AstemirModel;)Lcom/astemir/astemirlib/re/client/model/render/renderer/AstemirBlockEntityRenderer;'
          EGG_CLIENT='com.eternal_creations.archies_dino_mod.client.model.render.block.DinoEggClient'
          javap -classpath build/classes-pruned.jar -p -s "$EGG_CLIENT" | grep -F "descriptor: $EGG_RENDERER_DESC"
          BLOCK_RENDER_CALLS="$(javap -classpath build/classes-pruned.jar -p -c com.eternal_creations.archies_dino_mod.client.CommonClient)"
          BLOCK_COUNT="$(printf '%s\n' "$BLOCK_RENDER_CALLS" | grep -F -o "createRenderer:$EGG_RENDERER_DESC" | wc -l)"
          test "$BLOCK_COUNT" -eq 2
          if printf '%s\n' "$BLOCK_RENDER_CALLS" | grep -F "createRenderer:(Lcom/astemir/astemirlib/re/client/model/AstemirModel;)Lnet/minecraft/client/renderer/blockentity/BlockEntityRenderer;"; then
            echo "Found stale egg renderer descriptor in CommonClient."
            exit 1
          fi
          COMMON_CLIENT='com.eternal_creations.archies_dino_mod.client.CommonClient'
          BLOCK_HELPER_DESC='(Lcom/eternal_creations/archies_dino_mod/util/ResourceSupplier;Lnet/minecraft/client/renderer/blockentity/BlockEntityRenderer;)V'
          javap -classpath build/classes-pruned.jar -p -s "$COMMON_CLIENT" | grep -F "descriptor: $BLOCK_HELPER_DESC"
          BLOCK_HELPER_CALLS="$(printf '%s\n' "$BLOCK_RENDER_CALLS" | grep -F -o "registerBlockEntityRenderer:$BLOCK_HELPER_DESC" | wc -l)"
          test "$BLOCK_HELPER_CALLS" -eq 2
          if printf '%s\n' "$BLOCK_RENDER_CALLS" | grep -F "registerBlockEntityRenderer:(Ljava/util/function/Supplier;Lnet/minecraft/client/renderer/blockentity/BlockEntityRenderer;)V"; then
            echo "Found mismatched ResourceSupplier/Supplier block-entity renderer call."
            exit 1
          fi

      - name: Verify framework overrides, mounted attacks, and Lushsaur sprint controls
        shell: bash
        run: |
          set -euo pipefail

          verify_method() {
            local class_name="$1"
            local method_name="$2"
            local descriptor="$3"
            local output
            output="$(javap -classpath build/classes-pruned.jar -p -s "$class_name")"
            if ! grep -F -A1 "$method_name" <<< "$output" | grep -F "descriptor: $descriptor" >/dev/null; then
              echo "Missing required callback $class_name.$method_name $descriptor"
              exit 1
            fi
          }

          verify_method 'com.eternal_creations.archies_dino_mod.client.model.system.ADModifiers$1' \
            'modify(' '(ILcom/astemir/astemirlib/re/client/model/core/animation/AnimationState;FFLcom/astemir/astemirlib/re/client/model/core/animation/BoneState;)V'
          verify_method 'com.eternal_creations.archies_dino_mod.common.menu.DinoMenu' \
            'm_6875_(' '(Lnet/minecraft/world/entity/player/Player;)Z'
          verify_method 'com.eternal_creations.archies_dino_mod.common.menu.DinoMenu' \
            'm_7648_(' '(Lnet/minecraft/world/entity/player/Player;I)Lnet/minecraft/world/item/ItemStack;'
          verify_method 'com.eternal_creations.archies_dino_mod.client.screen.DinoScreen' \
            'm_7286_(' '(Lnet/minecraft/client/gui/GuiGraphics;FII)V'
          verify_method 'com.eternal_creations.archies_dino_mod.networking.serverbound.MountControlMessage' \
            'execute(' '(Lnet/minecraft/server/level/ServerPlayer;)V'
          verify_method 'com.eternal_creations.archies_dino_mod.client.ADClientForgeBus' \
            'onClientTick(' '(Lnet/minecraftforge/event/TickEvent$ClientTickEvent;)V'
          verify_method 'com.eternal_creations.archies_dino_mod.client.ADClientForgeBus' \
            'lambda$onClientTick$0(' '(Lnet/minecraft/client/Minecraft;Lnet/minecraft/client/KeyMapping;Ljava/util/function/BiConsumer;)V'
          verify_method 'com.eternal_creations.archies_dino_mod.common.entity.mob.lushsaur.LushsaurEntity' \
            'onRiderAttack(' '(Lnet/minecraft/world/entity/LivingEntity;Lcom/eternal_creations/archies_dino_mod/common/entity/base/Mount$AttackType;)V'
          verify_method 'com.eternal_creations.archies_dino_mod.common.entity.mob.chorusoatl.ChorusoatlEntity' \
            'onRiderAttack(' '(Lnet/minecraft/world/entity/LivingEntity;Lcom/eternal_creations/archies_dino_mod/common/entity/base/Mount$AttackType;)V'
          verify_method 'com.eternal_creations.archies_dino_mod.common.entity.mob.lushsaur.LushsaurEntity' \
            'm_6688_(' '()Lnet/minecraft/world/entity/LivingEntity;'
          verify_method 'com.eternal_creations.archies_dino_mod.common.entity.mob.lushsaur.LushsaurEntity' \
            'm_264410_(' '()Z'
          verify_method 'com.eternal_creations.archies_dino_mod.mixin.client.LocalPlayerMixin' \
            'archiesDinoMod$allowLushsaurSprint(' '(Lnet/minecraft/world/entity/Entity;Lorg/spongepowered/asm/mixin/injection/callback/CallbackInfoReturnable;)V'

          LOCAL_PLAYER_SPRINT="$(javap -classpath build/classes-pruned.jar -p -c com.eternal_creations.archies_dino_mod.mixin.client.LocalPlayerMixin)"
          for required_call in 'LushsaurEntity.m_6688_' 'CallbackInfoReturnable.setReturnValue'; do
            if ! printf '%s\n' "$LOCAL_PLAYER_SPRINT" | grep -Fq "$required_call"; then
              echo "LocalPlayer sprint gate is missing Lushsaur controller authorization: $required_call"
              printf '%s\n' "$LOCAL_PLAYER_SPRINT"
              exit 1
            fi
          done

          LOCAL_PLAYER_HANDLER="$(awk '
            /^[[:space:]]+public void archiesDinoMod\$allowLushsaurSprint\(/ { capture=1 }
            capture && /^[[:space:]]+(private|public|protected) / && $0 !~ /archiesDinoMod\$allowLushsaurSprint\(/ { exit }
            capture { print }
          ' <<< "$LOCAL_PLAYER_SPRINT")"
          BOX_LINE="$(printf '%s\n' "$LOCAL_PLAYER_HANDLER" | grep -nF 'Boolean.TRUE' | cut -d: -f1 || true)"
          SET_LINE="$(printf '%s\n' "$LOCAL_PLAYER_HANDLER" | grep -nF 'CallbackInfoReturnable.setReturnValue' | cut -d: -f1 || true)"
          if [ -z "$BOX_LINE" ] || [ -z "$SET_LINE" ] || [ "$BOX_LINE" -ge "$SET_LINE" ] || \
             printf '%s\n' "$LOCAL_PLAYER_HANDLER" | grep -Fq 'iconst_1'; then
            echo "Lushsaur sprint callback must pass boxed Boolean.TRUE to CallbackInfoReturnable, never a primitive int."
            printf '%s\n' "$LOCAL_PLAYER_HANDLER"
            exit 1
          fi
          echo "Verified Lushsaur sprint callback boxes its boolean return value as Boolean.TRUE."

          LUSH_SPRINT_CONTROL="$(javap -classpath build/classes-pruned.jar -p -c com.eternal_creations.archies_dino_mod.common.entity.mob.lushsaur.LushsaurEntity)"
          if ! grep -F -A5 'public boolean m_264410_();' <<< "$LUSH_SPRINT_CONTROL" | grep -F 'iconst_1' >/dev/null; then
            echo "Lushsaur canSprint override must return true for vanilla mounted sprint input."
            printf '%s\n' "$LUSH_SPRINT_CONTROL"
            exit 1
          fi

          for entity_class in \
            com.eternal_creations.archies_dino_mod.common.entity.mob.chorusoatl.ChorusoatlEntity \
            com.eternal_creations.archies_dino_mod.common.entity.mob.sculksaur.SculksaurEntity; do
            if javap -classpath build/classes-pruned.jar -p "$entity_class" | grep -Fq 'm_264410_('; then
              echo "$entity_class unexpectedly received the Lushsaur-only sprint override."
              exit 1
            fi
          done

          LUSHSAUR_CLIENT='com.eternal_creations.archies_dino_mod.client.model.render.entity.mob.LushsaurClient'
          verify_method "$LUSHSAUR_CLIENT" \
            'archiesDinoMod$shouldUseRunAnimation(' \
            '(Lcom/eternal_creations/archies_dino_mod/common/entity/mob/lushsaur/LushsaurEntity;)Z'
          LUSH_GAIT="$(javap -classpath build/classes-pruned.jar -p -c "$LUSHSAUR_CLIENT")"
          for required_call in 'LushsaurEntity.m_6688_' 'LivingEntity.m_20142_' \
            'EntityLocomotion.whenRunning' 'Condition.check'; do
            if ! printf '%s\n' "$LUSH_GAIT" | grep -Fq "$required_call"; then
              echo "Lushsaur run animation gate is missing $required_call"
              printf '%s\n' "$LUSH_GAIT"
              exit 1
            fi
          done
          echo "The bytecode pruner itself verified exactly two replaced Lushsaur run-animation conditions."

          AD_PLAYER_ANIMATIONS='com.eternal_creations.archies_dino_mod.client.animation.player.ADPlayerAnimations'
          AD_PLAYER_BYTECODE="$(javap -classpath build/classes-pruned.jar -p -c "$AD_PLAYER_ANIMATIONS")"
          for forbidden_layer in 'OnLushsaurPlayerAnimations.init' 'OnChorusoatlPlayerAnimations.init'; do
            if grep -Fq "$forbidden_layer" <<< "$AD_PLAYER_BYTECODE"; then
              echo "Special mount-specific player animation is still registered: $forbidden_layer"
              printf '%s\n' "$AD_PLAYER_BYTECODE"
              exit 1
            fi
          done
          echo "Verified vanilla passenger pose: custom Lushsaur/Chorusoatl rider animation layers are not registered."

          MOUNT_COMPONENT='com.eternal_creations.archies_dino_mod.common.entity.component.MountComponent'
          MOUNT_COMPONENT_BYTECODE="$(javap -classpath build/classes-pruned.jar -p -c "$MOUNT_COMPONENT")"
          MOUNT_TICK="$(awk '/tickRidden\(/ { capture=1; print; next } capture && /^  (public|private|protected) / { exit } capture { print }' <<< "$MOUNT_COMPONENT_BYTECODE")"
          for required_control in 'Player.f_20900_' 'Player.f_20902_' 'LushsaurEntity' 'ChorusoatlEntity'; do
            if ! grep -Fq "$required_control" <<< "$MOUNT_TICK"; then
              echo "Movement-gated mount steering is missing $required_control"
              printf '%s\n' "$MOUNT_TICK"
              exit 1
            fi
          done

          SIGNUM_COUNT="$(grep -F -c 'java/lang/Math.signum' <<< "$MOUNT_TICK" || true)"
          ABS_COUNT="$(grep -F -c 'java/lang/Math.abs' <<< "$MOUNT_TICK" || true)"
          if [ "$SIGNUM_COUNT" -ne 2 ] || [ "$ABS_COUNT" -ne 4 ]; then
            echo "Expected two branchless horizontal-input gates (2 signum / 4 abs), found signum=$SIGNUM_COUNT abs=$ABS_COUNT"
            printf '%s\n' "$MOUNT_TICK"
            exit 1
          fi

          if ! grep -Fq 'i2f' <<< "$MOUNT_TICK" || ! grep -Fq 'fmul' <<< "$MOUNT_TICK"; then
            echo "Missing branchless rider-pitch neutralization for Lushsaur/Chorusoatl."
            printf '%s\n' "$MOUNT_TICK"
            exit 1
          fi

          BRANCH_COUNT="$(grep -E -c '^[[:space:]]+[0-9]+: (if[a-z]+|goto|tableswitch|lookupswitch)' <<< "$MOUNT_TICK" || true)"
          if [ "$BRANCH_COUNT" -ne 3 ]; then
            echo "MountComponent.tickRidden must retain only its three original branches; found $BRANCH_COUNT."
            printf '%s\n' "$MOUNT_TICK"
            exit 1
          fi
          echo "Verified branchless horizontal-input steering and pitch neutralization; original tickRidden control flow and stack-map frames remain intact."

          LUSH_ROLL_CLIENT='com.eternal_creations.archies_dino_mod.client.model.render.entity.mob.LushsaurClient'
          SCULK_ROLL_CLIENT='com.eternal_creations.archies_dino_mod.client.model.render.entity.mob.SculksaurClient'
          CHORUS_ROLL_CLIENT='com.eternal_creations.archies_dino_mod.client.model.render.entity.mob.ChorusoatlClient'
          for C in "$LUSH_ROLL_CLIENT" "$SCULK_ROLL_CLIENT"; do
            DISASSEMBLY="$(javap -classpath build/classes-pruned.jar -p -c "$C")"
            if grep -Fq 'RollOnRotation' <<< "$DISASSEMBLY"; then
              echo "Unwanted lateral root roll remains in $C"
              printf '%s\n' "$DISASSEMBLY"
              exit 1
            fi
            for preserved_operation in 'CommonRootOperations.SHAKING' 'SmoothBodyRotation.of' 'CommonRootOperations.GRUMM_ROTATION'; do
              if ! grep -Fq "$preserved_operation" <<< "$DISASSEMBLY"; then
                echo "Roll removal damaged another root operation in $C: $preserved_operation"
                printf '%s\n' "$DISASSEMBLY"
                exit 1
              fi
            done
            ROOT_INIT="$(printf '%s\n' "$DISASSEMBLY" | sed -n '/onInitialize(/,/^  public /p')"
            if [ "$(printf '%s\n' "$ROOT_INIT" | grep -F -o 'ModelSystem.addRootOperation' | wc -l)" -ne 1 ] ||
               [ "$(printf '%s\n' "$ROOT_INIT" | grep -F -o 'iconst_3' | wc -l)" -lt 1 ]; then
              echo "Expected one three-entry root operation array in $C after removing only RollOnRotation."
              printf '%s\n' "$ROOT_INIT"
              exit 1
            fi
          done
          CHORUS_ROLL="$(javap -classpath build/classes-pruned.jar -p -c "$CHORUS_ROLL_CLIENT")"
          if ! grep -Fq 'ChorusoatlEntity.flyingRoll' <<< "$CHORUS_ROLL" ||
             ! grep -Fq 'ChasingFloat.get:(F)F' <<< "$CHORUS_ROLL"; then
            echo "Original Chorusoatl flyingRoll animation read was not retained."
            printf '%s\n' "$CHORUS_ROLL"
            exit 1
          fi
          echo "Verified only Lushsaur/Sculksaur RollOnRotation is removed; SHAKING, SmoothBodyRotation and GRUMM_ROTATION remain, and Chorusoatl flight banking is preserved."

          LUSH_ENTITY_BYTECODE="$(javap -classpath build/classes-pruned.jar -p -c com.eternal_creations.archies_dino_mod.common.entity.mob.lushsaur.LushsaurEntity)"
          LUSH_MOUNT_METHOD="$(awk '/ createMount\(/ { capture=1; print; next } capture && /^  (public|private|protected) / { exit } capture { print }' <<< "$LUSH_ENTITY_BYTECODE")"
          if [[ "$LUSH_MOUNT_METHOD" != *"passengerOffset"* ||
                "$LUSH_MOUNT_METHOD" != *"float 0.0625f"* ||
                "$LUSH_MOUNT_METHOD" == *"fconst_1"* ]]; then
            echo "Lushsaur passenger hitbox must move 15 pixels back to passengerOffset(0, 0, 0.0625)."
            printf '%s\n' "$LUSH_MOUNT_METHOD"
            exit 1
          fi

          LUSH_MOUNT_POINTS="$(javap -classpath build/classes-pruned.jar -p -c "$LUSH_ROLL_CLIENT" | sed -n '/static {};/,/^  private static boolean /p')"
          if [[ "$LUSH_MOUNT_POINTS" != *"dconst_0"* ||
                "$LUSH_MOUNT_POINTS" != *"double 0.15d"* ||
                "$LUSH_MOUNT_POINTS" == *"double 0.3374999761581421d"* ||
                "$LUSH_MOUNT_POINTS" == *"double 0.9375d"* ||
                "$LUSH_MOUNT_POINTS" == *"double -0.8125d"* ||
                "$LUSH_MOUNT_POINTS" == *"double -1.4125d"* ]]; then
            echo "Only the unsaddled Lushsaur model anchor must move 3 pixels forward from the previous screenshot (Z = +0.15); the unused saddled anchor remains original."
            printf '%s\n' "$LUSH_MOUNT_POINTS"
            exit 1
          fi
          echo "Verified 15-pixel passenger-hitbox correction and 3-pixel forward visual adjustment."

          MOUNT_COMPONENT_INTERACT="$(awk '/public net.minecraft.world.InteractionResult mobInteract/ { capture=1; print; next } capture && /^  (public|private|protected) / { exit } capture { print }' <<< "$MOUNT_COMPONENT_BYTECODE")"
          SADDLE_CAPABILITY_LINE="$(grep -nF 'Saddleable.m_6741_:' <<< "$MOUNT_COMPONENT_INTERACT" | head -n 1 | cut -d: -f1 || true)"
          SADDLE_CONSUME_LINE="$(grep -nF 'ItemStack.m_41774_:(I)V' <<< "$MOUNT_COMPONENT_INTERACT" | head -n 1 | cut -d: -f1 || true)"
          SADDLE_STATE_LINE="$(grep -nF 'Mount.setSaddled:(Z)V' <<< "$MOUNT_COMPONENT_INTERACT" | head -n 1 | cut -d: -f1 || true)"
          SADDLE_SOUND_LINE="$(grep -nF 'Level.m_6269_:' <<< "$MOUNT_COMPONENT_INTERACT" | head -n 1 | cut -d: -f1 || true)"
          if [[ "$MOUNT_COMPONENT_INTERACT" != *"Items.f_42450_"* ||
                "$MOUNT_COMPONENT_INTERACT" != *"ItemStack.m_150930_"* ||
                -z "$SADDLE_CAPABILITY_LINE" || -z "$SADDLE_CONSUME_LINE" ||
                -z "$SADDLE_STATE_LINE" || -z "$SADDLE_SOUND_LINE" ||
                "$SADDLE_CAPABILITY_LINE" -ge "$SADDLE_CONSUME_LINE" ||
                "$SADDLE_CAPABILITY_LINE" -ge "$SADDLE_STATE_LINE" ||
                "$SADDLE_CAPABILITY_LINE" -ge "$SADDLE_SOUND_LINE" ]]; then
            echo "MountComponent must gate its vanilla saddle fallback before consumption, saddle state, and sound."
            printf '%s\\n' "$MOUNT_COMPONENT_INTERACT"
            exit 1
          fi
          echo "Verified MountComponent checks Saddleable.isSaddleable before consuming a saddle or changing state/playing sound."

          LUSH_INTERACT="$(awk '/public net.minecraft.world.InteractionResult m_6071_/ { capture=1; print; next } capture && /^  (public|private|protected) / { exit } capture { print }' <<< "$LUSH_ENTITY_BYTECODE")"
          if [[ "$LUSH_INTERACT" != *"isBuried"* ||
                "$LUSH_INTERACT" != *"AbstractComplexMount.m_6071_"* ||
                "$LUSH_INTERACT" == *"InteractionResult.FAIL"* ]]; then
            echo "Lushsaur original mobInteract behavior must remain intact."
            printf '%s\\n' "$LUSH_INTERACT"
            exit 1
          fi

          check_method() {
            local method_name="$1"
            local pattern="$2"
            local method_body
            method_body="$(awk -v pattern="$method_name" '
              index($0, pattern) { capture=1; print; next }
              capture && /^  (public|private|protected) / { exit }
              capture { print }
            ' <<< "$LUSH_ENTITY_BYTECODE")"
            if [[ "$method_body" != *"$pattern"* ]]; then
              echo "Missing equipment override: $method_name"
              exit 1
            fi
            printf '%s' "$method_body"
          }

          LUSH_SADDLEABLE="$(awk '/ m_6741_/ { capture=1; print; next } capture && /^  (public|private|protected) / { exit } capture { print }' <<< "$LUSH_ENTITY_BYTECODE")"
          LUSH_IS_SADDLED="$(awk '/ m_6254_/ { capture=1; print; next } capture && /^  (public|private|protected) / { exit } capture { print }' <<< "$LUSH_ENTITY_BYTECODE")"
          LUSH_SET_SADDLED="$(awk '/ setSaddled/ { capture=1; print; next } capture && /^  (public|private|protected) / { exit } capture { print }' <<< "$LUSH_ENTITY_BYTECODE")"
