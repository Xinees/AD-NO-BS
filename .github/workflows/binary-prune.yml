name: Direct Legacy JAR Prune - build 41

on:
  push:
    branches:
      - binary-prune/legacy
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: legacy-prune-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout binary workspace
        uses: actions/checkout@v4
        with:
          ref: binary-prune/legacy

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify untouched source JAR
        shell: bash
        run: |
          set -euo pipefail
          test -s ec_ad-forge-1.20.1-1.0.4.jar
          ORIGINAL_SHA="$(sha256sum ec_ad-forge-1.20.1-1.0.4.jar | cut -d' ' -f1)"
          test "$ORIGINAL_SHA" = "8df20e08d46f778a6e975b60b0cc7e19ff674264834812015537d7ef0fb121b1"
          echo "Immutable original input hash verified."
          echo "Original JAR SHA-256: $ORIGINAL_SHA"

      - name: Download ASM bytecode tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/tools
          curl --fail --location --retry 3 \
            https://repo.maven.apache.org/maven2/org/ow2/asm/asm/9.7.1/asm-9.7.1.jar \
            -o build/tools/asm-9.7.1.jar
          curl --fail --location --retry 3 \
            https://repo.maven.apache.org/maven2/org/ow2/asm/asm-tree/9.7.1/asm-tree-9.7.1.jar \
            -o build/tools/asm-tree-9.7.1.jar

      - name: Compile direct bytecode pruner
        shell: bash
        run: |
          set -euo pipefail
          CP="build/tools/asm-9.7.1.jar:build/tools/asm-tree-9.7.1.jar"
          javac -encoding UTF-8 -cp "$CP" -d build/tools tools/JarPruner.java

      - name: Decompress and compile isolated Legacy behavior hooks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/behavior-hooks
          cat tools/LegacyBehaviorHooks.part1.b64 tools/LegacyBehaviorHooks.part2.b64 tools/LegacyBehaviorHooks.part3.b64 tools/LegacyBehaviorHooks.part4.b64 | base64 -d | gzip -dc > build/LegacyBehaviorHooks.java
          python3 tools/polish_legacy_hooks.py build/LegacyBehaviorHooks.java
          javac -encoding UTF-8 --release 17 -d build/behavior-hooks build/LegacyBehaviorHooks.java

      - name: Inspect existing Chorusoatl landing route implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path("build/LegacyBehaviorHooks.java").read_text(encoding="utf-8")
          declarations = list(re.finditer(
              r"(?m)^    (?:public|private|protected)\\s+(?:static\\s+)?[^;{}\\n]+\\([^;{}]*\\)(?:\\s*throws\\s+[^{}]+)?\\s*\\{",
              source
          ))

          def block_for(match):
              start = match.start()
              opening = source.find("{", match.start(), match.end())
              depth = 0
              in_string = False
              escape = False
              for index in range(opening, len(source)):
                  ch = source[index]
                  if in_string:
                      if escape:
                          escape = False
                      elif ch == "\\\\":
                          escape = True
                      elif ch == '"':
                          in_string = False
                      continue
                  if ch == '"':
                      in_string = True
                  elif ch == "{":
                      depth += 1
                  elif ch == "}":
                      depth -= 1
                      if depth == 0:
                          return source[start:index + 1]
              raise RuntimeError("Unclosed Java method in LegacyBehaviorHooks")

          tokens = (
              "chorusoatlTick", "PREPARING_TO_LAND", "PREPARING_TO_FLY",
              "validPlatform(", "overlapsOtherChorusoatl(",
              "landing", "Landing", "moveTo(", "m_26519_", "m_5624_",
              "PathNavigation", "navigation", "pathfind"
          )
          matches = []
          for declaration in declarations:
              block = block_for(declaration)
              if any(token in block for token in tokens):
                  signature = block.split("{", 1)[0].strip().replace("\\n", " ")
                  if not any(signature == prior[0] for prior in matches):
                      matches.append((signature, block))
          print("Matched %d Chorusoatl/landing/navigation methods" % len(matches))
          for signature, block in matches:
              print("\\n===== %s =====" % signature)
              print(block)
          PY

      - name: Prune classes and registrations in the original JAR
        shell: bash
        run: |
          set -euo pipefail
          CP="build/tools:build/tools/asm-9.7.1.jar:build/tools/asm-tree-9.7.1.jar"
          java -cp "$CP" JarPruner \
            ec_ad-forge-1.20.1-1.0.4.jar \
            build/classes-pruned.jar
          jar uf build/classes-pruned.jar -C build/behavior-hooks .

      - name: Prune resources inside the JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/libs
          python3 tools/prune_binary_jar.py \
            build/classes-pruned.jar \
            build/libs/archie_dinosaurs-legacy-forge-1.20.1.jar

      - name: Verify Sculksaur multipart hitboxes
        shell: bash
        run: |
          set -euo pipefail

          JAR="build/libs/archie_dinosaurs-legacy-forge-1.20.1.jar"
          SCULK_CLASS='com.eternal_creations.archies_dino_mod.common.entity.mob.sculksaur.SculksaurEntity'
          SCULK="$(javap -classpath "$JAR" -p -c "$SCULK_CLASS")"
          SCULK_METHODS="$(javap -classpath "$JAR" -p -s "$SCULK_CLASS")"
          SCULK_VERBOSE="$(javap -classpath "$JAR" -p -v "$SCULK_CLASS")"

          for entry in \
            'com/eternal_creations/archies_dino_mod/common/entity/base/IMultipartEntity.class' \
            'com/eternal_creations/archies_dino_mod/common/entity/base/IPartEntity.class' \
            'com/eternal_creations/archies_dino_mod/common/entity/base/SimplePart.class' \
            'com/eternal_creations/archies_dino_mod/entity/ForgeEntityPart.class' \
            'com/eternal_creations/archies_dino_mod/mixin/EntityAccessor.class' \
            'com/eternal_creations/archies_dino_mod/mixin/forge/ForgeEntityMultipartMixin.class'; do
            if ! jar tf "$JAR" | grep -Fxq "$entry"; then
              echo "Sculksaur multipart dependency is missing: $entry"
              exit 1
            fi
          done

          if ! grep -Fq 'com/eternal_creations/archies_dino_mod/common/entity/base/IMultipartEntity' <<< "$SCULK_VERBOSE"; then
            echo "SculksaurEntity class metadata does not declare IMultipartEntity."
            exit 1
          fi

          for part in neck1 neck2 tail1 tail2; do
            if ! grep -Fq " $part;" <<< "$SCULK_METHODS"; then
              echo "Sculksaur multipart field is missing: $part"
              exit 1
            fi
          done
          if ! grep -Fq ' parts;' <<< "$SCULK_METHODS"; then
            echo "Sculksaur IPartEntity array field is missing."
            exit 1
          fi

          CONSTRUCTOR_PARTS="$(grep -oF 'SimplePart."<init>"' <<< "$SCULK" | wc -l | tr -d ' ')"
          if [[ "$CONSTRUCTOR_PARTS" != "4" ]]; then
            echo "Expected four SimplePart constructor calls, found $CONSTRUCTOR_PARTS"
            exit 1
          fi
          PART_TICKS="$(grep -oF 'SimplePart.tick:()V' <<< "$SCULK" | wc -l | tr -d ' ')"
          if [[ "$PART_TICKS" != "4" ]]; then
            echo "Expected four per-tick SimplePart updates, found $PART_TICKS"
            exit 1
          fi
          if ! grep -Fq 'SimplePart.collectEntities:' <<< "$SCULK"; then
            echo "Sculksaur multipart IDs are not initialized through collectEntities."
            exit 1
          fi

          for method in 'getIParts' 'hurtFromPart' 'interactFromPart'; do
            if ! grep -Fq " $method(" <<< "$SCULK_METHODS"; then
              echo "Sculksaur multipart callback is missing: $method"
              exit 1
            fi
          done
          if ! grep -Fq 'm_6469_:(Lnet/minecraft/world/damagesource/DamageSource;F)Z' <<< "$SCULK"; then
            echo "Multipart damage is not delegated to the parent Sculksaur."
            exit 1
          fi
          if ! grep -Fq 'm_6071_:(Lnet/minecraft/world/entity/player/Player;Lnet/minecraft/world/InteractionHand;)Lnet/minecraft/world/InteractionResult;' <<< "$SCULK"; then
            echo "Multipart interaction is not delegated to the parent Sculksaur."
            exit 1
          fi

          SIMPLE_PART="$(javap -classpath "$JAR" -p -c com.eternal_creations.archies_dino_mod.common.entity.base.SimplePart)"
          if ! grep -Fq 'ICommonHelper.makePartEntity' <<< "$SIMPLE_PART"; then
            echo "SimplePart is not creating the Forge part entities through ICommonHelper."
            exit 1
          fi

          python3 - "$JAR" <<'PY'
          import json
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as jar:
              config = json.loads(jar.read("archie_dinosaurs.forge.mixins.json"))
          mixins = config.get("mixins", [])
          if "forge.ForgeEntityMultipartMixin" not in mixins:
              raise SystemExit("ForgeEntityMultipartMixin is not registered in the Forge mixin config.")
          print("Verified Forge multipart mixin registration.")
          PY

          echo "Verified Sculksaur's two neck and two tail hitboxes, update loop, part ID allocation, damage/interact delegation, and Forge integration."

      - name: Audit original and retained mob turn controllers
        shell: bash
        run: |
          set -euo pipefail

          dump_method() {
            local jar="$1"
            local class="$2"
            local method="$3"
            echo "===== $jar :: $class :: $method ====="
            javap -classpath "$jar" -p -c "$class" | awk -v method="$method" '
              index($0, method) > 0 { capture=1 }
              capture { print }
              capture && NF == 0 { exit }
            '
          }

          ORIGINAL_JAR="ec_ad-forge-1.20.1-1.0.4.jar"
          PRUNED_JAR="build/classes-pruned.jar"

          for JAR in "$ORIGINAL_JAR" "$PRUNED_JAR"; do
            dump_method "$JAR" com.eternal_creations.archies_dino_mod.common.entity.ai.control.SmoothMoveControl 'tick3DMovement('
            dump_method "$JAR" com.eternal_creations.archies_dino_mod.common.entity.ai.control.SmoothMoveControl 'tickClimber('
            dump_method "$JAR" com.eternal_creations.archies_dino_mod.common.entity.ai.control.SmoothMoveControl 'tickWalker('
            dump_method "$JAR" com.eternal_creations.archies_dino_mod.common.entity.ai.control.SmoothMoveControl 'smoothRotlerp('
            dump_method "$JAR" com.eternal_creations.archies_dino_mod.common.entity.ai.control.SmoothBodyControl 'm_8121_('
            dump_method "$JAR" com.eternal_creations.archies_dino_mod.common.entity.ai.control.SmoothLookControl 'm_8128_('
          done

      - name: Verify retained renderer method descriptors
        shell: bash
        run: |
          set -euo pipefail
          PROVIDER_DESC='()Lcom/astemir/astemirlib/re/client/model/render/renderer/AstemirEntityRenderer$Provider;'
          for class_name in \
            com.eternal_creations.archies_dino_mod.client.model.render.entity.mob.LushsaurClient \
            com.eternal_creations.archies_dino_mod.client.model.render.entity.mob.ChorusoatlClient \
            com.eternal_creations.archies_dino_mod.client.model.render.entity.mob.SculksaurClient
          do
            javap -classpath build/classes-pruned.jar -p -s "$class_name" | grep -F "descriptor: $PROVIDER_DESC"
          done
          RENDER_CALLS="$(javap -classpath build/classes-pruned.jar -p -c com.eternal_creations.archies_dino_mod.client.CommonClient)"
          COUNT="$(printf '%s\n' "$RENDER_CALLS" | grep -F -o "createRenderProvider:$PROVIDER_DESC" | wc -l)"
          test "$COUNT" -eq 3
          if printf '%s\n' "$RENDER_CALLS" | grep -F "createRenderProvider:()Lnet/minecraft/client/renderer/entity/EntityRendererProvider;"; then
            echo "Found stale renderer descriptor in CommonClient."
            exit 1
          fi
          if ! printf '%s\n' "$RENDER_CALLS" | grep -F "m_174009_:()Lnet/minecraft/client/renderer/entity/EntityRendererProvider;"; then
            echo "Missing correctly named EntityRendererProvider lambda SAM."
            exit 1
          fi
          if printf '%s\n' "$RENDER_CALLS" | grep -F "get:()Lnet/minecraft/client/renderer/entity/EntityRendererProvider;"; then
            echo "Found invalid EntityRendererProvider lambda SAM name."
            exit 1
          fi
          EGG_RENDERER_DESC='(Lcom/astemir/astemirlib/re/client/model/AstemirModel;)Lcom/astemir/astemirlib/re/client/model/render/renderer/AstemirBlockEntityRenderer;'
          EGG_CLIENT='com.eternal_creations.archies_dino_mod.client.model.render.block.DinoEggClient'
          javap -classpath build/classes-pruned.jar -p -s "$EGG_CLIENT" | grep -F "descriptor: $EGG_RENDERER_DESC"
          BLOCK_RENDER_CALLS="$(javap -classpath build/classes-pruned.jar -p -c com.eternal_creations.archies_dino_mod.client.CommonClient)"
          BLOCK_COUNT="$(printf '%s\n' "$BLOCK_RENDER_CALLS" | grep -F -o "createRenderer:$EGG_RENDERER_DESC" | wc -l)"
          test "$BLOCK_COUNT" -eq 2
          if printf '%s\n' "$BLOCK_RENDER_CALLS" | grep -F "createRenderer:(Lcom/astemir/astemirlib/re/client/model/AstemirModel;)Lnet/minecraft/client/renderer/blockentity/BlockEntityRenderer;"; then
            echo "Found stale egg renderer descriptor in CommonClient."
            exit 1
          fi
          COMMON_CLIENT='com.eternal_creations.archies_dino_mod.client.CommonClient'
          BLOCK_HELPER_DESC='(Lcom/eternal_creations/archies_dino_mod/util/ResourceSupplier;Lnet/minecraft/client/renderer/blockentity/BlockEntityRenderer;)V'
          javap -classpath build/classes-pruned.jar -p -s "$COMMON_CLIENT" | grep -F "descriptor: $BLOCK_HELPER_DESC"
          BLOCK_HELPER_CALLS="$(printf '%s\n' "$BLOCK_RENDER_CALLS" | grep -F -o "registerBlockEntityRenderer:$BLOCK_HELPER_DESC" | wc -l)"
          test "$BLOCK_HELPER_CALLS" -eq 2
          if printf '%s\n' "$BLOCK_RENDER_CALLS" | grep -F "registerBlockEntityRenderer:(Ljava/util/function/Supplier;Lnet/minecraft/client/renderer/blockentity/BlockEntityRenderer;)V"; then
            echo "Found mismatched ResourceSupplier/Supplier block-entity renderer call."
            exit 1
          fi

      - name: Verify Lushsaur-only passenger cooldown and removed player flee goal
        shell: bash
        run: |
          set -euo pipefail

          MOUNT_COMPONENT="$(javap -classpath build/classes-pruned.jar -p -c com.eternal_creations.archies_dino_mod.common.entity.component.MountComponent)"
          ADD_PASSENGER="$(printf '%s\n' "$MOUNT_COMPONENT" | sed -n '/public void addPassenger(/,/public boolean isNoPassengerCooldown/p')"
          if ! grep -Fq 'LushsaurEntity' <<< "$ADD_PASSENGER"; then
            echo "MountComponent.addPassenger does not contain the Lushsaur-only cooldown check."
            exit 1
          fi
          if ! grep -Fq 'ixor' <<< "$ADD_PASSENGER" || ! grep -Fq 'imul' <<< "$ADD_PASSENGER"; then
            echo "Lushsaur-only cooldown calculation is incomplete."
            exit 1
          fi
          if ! grep -Fq 'bipush        20' <<< "$ADD_PASSENGER"; then
            echo "The original 20-tick cooldown for other mounts was not retained."
            exit 1
          fi

          LUSH_AI="$(javap -classpath build/classes-pruned.jar -p -c com.eternal_creations.archies_dino_mod.common.entity.mob.lushsaur.ai.LushsaurAI)"
          SETUP_AI="$(printf '%s\n' "$LUSH_AI" | sed -n '/setupAI(/,/^  private /p')"
          if grep -Fq 'GoalAvoidEntity.of' <<< "$SETUP_AI"; then
            echo "Lushsaur setupAI still constructs the player-avoidance goal."
            exit 1
          fi
          if ! grep -Fq 'LushsaurGoalHideFromEntities' <<< "$SETUP_AI"; then
            echo "Lushsaur Raider hide goal was unexpectedly removed."
            exit 1
          fi

          echo "Verified Lushsaur input is immediate after mounting, other mounts keep the original 20-tick gate, player flee is removed, and Raider hiding remains."

      - name: Verify Legacy mob hooks and Lush Caves spawning
        shell: bash
        run: |
          set -euo pipefail

          JAR="build/libs/archie_dinosaurs-legacy-forge-1.20.1.jar"
          HOOKS='com/eternal_creations/archies_dino_mod/legacy/LegacyBehaviorHooks.class'
          jar tf "$JAR" | grep -Fx "$HOOKS"

          LUSH="$(javap -classpath "$JAR" -p -c com.eternal_creations.archies_dino_mod.common.entity.mob.lushsaur.LushsaurEntity)"
          grep -Fq 'LegacyBehaviorHooks.lushsaurTick' <<< "$LUSH"
          grep -Fq 'LegacyBehaviorHooks.saveLush' <<< "$LUSH"
          grep -Fq 'LegacyBehaviorHooks.loadLush' <<< "$LUSH"
          grep -Fq 'LegacyBehaviorHooks.afterLushFeed' <<< "$LUSH"

          CHORUS="$(javap -classpath "$JAR" -p -c com.eternal_creations.archies_dino_mod.common.entity.mob.chorusoatl.ChorusoatlEntity)"
          grep -Fq 'LegacyBehaviorHooks.chorusoatlTick' <<< "$CHORUS"
          grep -Fq 'LegacyBehaviorHooks.saveChorusoatl' <<< "$CHORUS"
          grep -Fq 'LegacyBehaviorHooks.loadChorusoatl' <<< "$CHORUS"
          grep -Fq 'LegacyBehaviorHooks.shouldSuppressChorusoatlFlightPhase' <<< "$CHORUS"

          CHORUS_CLIENT_CLASS='com.eternal_creations.archies_dino_mod.client.model.render.entity.mob.ChorusoatlClient'
          CHORUS_CLIENT="$(javap -classpath "$JAR" -p -c -v "$CHORUS_CLIENT_CLASS")"
          ACTION_STATE_REF='REF_invokeVirtual com/astemir/astemirlib/re/common/action/ActionState.isActiveWithoutFadeOut:()Z'
          AIR_STATE_REF='REF_invokeVirtual com/eternal_creations/archies_dino_mod/common/entity/mob/chorusoatl/ChorusoatlEntity.isFlying:()Z'
          if ! grep -Fq "$ACTION_STATE_REF" <<< "$CHORUS_CLIENT"; then
            echo "Original UP/DOWN ActionState animation conditions were changed."
            exit 1
          fi
          if ! grep -Fq "$AIR_STATE_REF" <<< "$CHORUS_CLIENT"; then
            echo "Original Chorusoatl isFlying animation condition was changed."
            exit 1
          fi
          if grep -Fq 'legacy$chorusoatlActionStateAnimationActive' <<< "$CHORUS_CLIENT" ||
             grep -Fq 'legacy$chorusoatlAirState' <<< "$CHORUS_CLIENT"; then
            echo "Obsolete vertical-animation bridge remains in ChorusoatlClient."
            exit 1
          fi
          CHORUS_CLIENT_METHODS="$(javap -classpath "$JAR" -p -s "$CHORUS_CLIENT_CLASS")"
          if grep -Fq 'legacy$chorusoatlActionStateAnimationActive' <<< "$CHORUS_CLIENT_METHODS" ||
             grep -Fq 'legacy$chorusoatlAirState' <<< "$CHORUS_CLIENT_METHODS"; then
            echo "Synthetic vertical-animation bridge method remains in ChorusoatlClient."
            exit 1
          fi

          STROLL="$(javap -classpath "$JAR" -p -c com.eternal_creations.archies_dino_mod.common.entity.ai.goal.GoalStrollLandAndAir)"
          grep -Fq 'LegacyBehaviorHooks.shouldSuppressChorusStroll' <<< "$STROLL"
          PACK="$(javap -classpath "$JAR" -p -c com.eternal_creations.archies_dino_mod.common.entity.mob.chorusoatl.ai.ChorusoatlGoalFollowPack)"
          grep -Fq 'LegacyBehaviorHooks.shouldSuppressChorusPackFollow' <<< "$PACK"
          grep -Fq 'PathNavigation.m_26571_' <<< "$PACK"
          python3 - <<'PY'
          from pathlib import Path
          source = Path("build/LegacyBehaviorHooks.java").read_text(encoding="utf-8")
          required = (
              "shouldSuppressChorusoatlFlightPhase",
              'state.mode == 2 && "PREPARING_TO_FLY".equals(name)',
              'state.mode == 1 && "PREPARING_TO_LAND".equals(name)',
              "return dx * dx + dz * dz > 36.0 || Math.abs(dy) > 4.0;",
              "Collections.synchronizedMap(new WeakHashMap<>())",
              "METHOD_CACHE.computeIfAbsent",
              "FIELD_CACHE.computeIfAbsent",
              "warning == null || !warning.berriesSeen",
              "if (surfaceY > y)",
              "validPlatform(mob, level, posClass, heightType, px, py, pz)",
              'double mobHeight = boxValue(mobBox, "f_82292_") - boxValue(mobBox, "f_82289_");',
              "int clearHeight = (int)Math.ceil(mobHeight);",
              "now >= state.nextPathUpdate",
              "state.nextPathUpdate = now + 20",
              "m_60783_",
              "m_82386_",
              "point[0] - ((Number)currentX).doubleValue()",
              "if (!(intersects instanceof Boolean))",
          )
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit("LegacyBehaviorHooks regression guards failed: " + repr(missing))
          if "allowChorusoatlFlightPhase" in source:
              raise SystemExit("The inverted allow/suppress flight-phase helper must not return.")
          if "m_60828_" in source:
              raise SystemExit("Landing support must use face-sturdy checks, not suffocation checks.")
          for forbidden in ("py >= 250", "point[0] - 1.8", "point[1] + 5.2", "up < 6", "surfaceY < y - 1"):
              if forbidden in source:
                  raise SystemExit("Unjustified fixed landing constraint remains: " + forbidden)
          PY

          if jar tf "$JAR" | grep -E 'data/archie_dinosaurs/(worldgen/structure|worldgen/structure_set|structures)/.*lushsaur|tags/worldgen/biome/spawns_lushsaurs.json'; then
            echo "Removed Lushsaur structure or structure-spawn resources remain."
            exit 1
          fi

          python3 - <<'PY'
          import json, zipfile
          path = "build/libs/archie_dinosaurs-legacy-forge-1.20.1.jar"
          with zipfile.ZipFile(path) as jar:
              modifier = json.loads(jar.read("data/archie_dinosaurs/forge/biome_modifier/lushsaur_spawns.json"))
          assert modifier["biomes"] == "minecraft:lush_caves"
          assert modifier["spawners"] == [{
              "type": "archie_dinosaurs:lushsaur",
              "weight": 1, "minCount": 1, "maxCount": 1
          }]
          print("Verified rare Lushsaur natural spawning in lush caves and no Lushsaur structure.")
          PY

      - name: Verify framework overrides, mounted attacks, and Lushsaur sprint controls
        shell: bash
        run: |
          set -euo pipefail

          verify_method() {
            local class_name="$1"
            local method_name="$2"
            local descriptor="$3"
            local output
            output="$(javap -classpath build/classes-pruned.jar -p -s "$class_name")"
            if ! grep -F -A1 "$method_name" <<< "$output" | grep -F "descriptor: $descriptor" >/dev/null; then
              echo "Missing required callback $class_name.$method_name $descriptor"
              exit 1
            fi
          }

          verify_method 'com.eternal_creations.archies_dino_mod.client.model.system.ADModifiers$1' \
            'modify(' '(ILcom/astemir/astemirlib/re/client/model/core/animation/AnimationState;FFLcom/astemir/astemirlib/re/client/model/core/animation/BoneState;)V'
          verify_method 'com.eternal_creations.archies_dino_mod.common.menu.DinoMenu' \
            'm_6875_(' '(Lnet/minecraft/world/entity/player/Player;)Z'
          verify_method 'com.eternal_creations.archies_dino_mod.common.menu.DinoMenu' \
            'm_7648_(' '(Lnet/minecraft/world/entity/player/Player;I)Lnet/minecraft/world/item/ItemStack;'
          verify_method 'com.eternal_creations.archies_dino_mod.client.screen.DinoScreen' \
            'm_7286_(' '(Lnet/minecraft/client/gui/GuiGraphics;FII)V'
          verify_method 'com.eternal_creations.archies_dino_mod.networking.serverbound.MountControlMessage' \
            'execute(' '(Lnet/minecraft/server/level/ServerPlayer;)V'
          verify_method 'com.eternal_creations.archies_dino_mod.networking.serverbound.PopZitMessage' \
            'execute(' '(Lnet/minecraft/server/level/ServerPlayer;)V'
          verify_method 'com.eternal_creations.archies_dino_mod.networking.serverbound.PopZitMessage' \
            'damageSculksaurOnWartPop(' '(Lcom/eternal_creations/archies_dino_mod/common/entity/mob/sculksaur/SculksaurEntity;Lnet/minecraft/server/level/ServerPlayer;I)V'
