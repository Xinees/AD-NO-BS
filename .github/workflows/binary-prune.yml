name: Direct Legacy JAR Prune - build 47

on:
  push:
    branches:
      - binary-prune/legacy
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: legacy-prune-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout binary workspace
        uses: actions/checkout@v4
        with:
          ref: binary-prune/legacy

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Compile End Peaks worldgen
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p worldgen jar
          WORLDGEN_JAR="worldgen/build/libs/legacy-worldgen-1.0.0.jar"
          test -s "$WORLDGEN_JAR"
          test -s worldgen/build/classes/java/main/com/eternal_creations/archies_dino_mod/mixin/EndPeaksBiomeSourceMixin.class
          test -s worldgen/build/classes/java/main/com/eternal_creations/archies_dino_mod/mixin/EndPeaksHolderReferenceAccessor.class
          javap -classpath "$WORLDGEN_JAR" -v com.eternal_creations.archies_dino_mod.worldgen.EndPeaksFeatureRegistry > worldgen/build/end-peaks-registry-reobf.txt
          if ! grep -Fq 'ForgeRegistries$Keys.FEATURES' worldgen/build/end-peaks-registry-reobf.txt; then
            echo "Reobfuscated End Peaks registry does not reference ForgeRegistries.Keys.FEATURES."
            cat worldgen/build/end-peaks-registry-reobf.txt
            exit 1
          fi
          if grep -Fq 'Registries.FEATURE' build/end-peaks-registry-reobf.txt; then
            echo "End Peaks registry still contains the unmapped vanilla FEATURE field reference."
            cat build/end-peaks-registry-reobf.txt
            exit 1
          fi
          test -s worldgen/build/classes/java/main/com/eternal_creations/archies_dino_mod/worldgen/EndPeaksWorldgen.class
          test -s worldgen/build/classes/java/main/com/eternal_creations/archies_dino_mod/worldgen/EndPeaksMountainFeature.class
          test -s worldgen/build/classes/java/main/com/eternal_creations/archies_dino_mod/worldgen/EndPeaksChorusFeature.class
          test -s worldgen/build/classes/java/main/com/eternal_creations/archies_dino_mod/worldgen/EndPeaksChorusoatlSpawnLimiter.class
          test -s worldgen/build/classes/java/main/com/eternal_creations/archies_dino_mod/worldgen/EndPeaksFeatureRegistry.class
          test -s worldgen/build/resources/main/end_peaks.mixins.json
          REFMAP="$(find worldgen/build -type f -name end_peaks.refmap.json -print -quit)"
          if [[ -z "$REFMAP" ]]; then
            echo "Mixin annotation processor did not produce end_peaks.refmap.json."
            exit 1
          fi
          if [[ "$REFMAP" != "worldgen/build/resources/main/end_peaks.refmap.json" ]]; then
            cp "$REFMAP" worldgen/build/resources/main/end_peaks.refmap.json
          fi
          test -s worldgen/build/resources/main/end_peaks.refmap.json

      - name: Verify untouched source JAR
        shell: bash
        run: |
          set -euo pipefail
          test -s ec_ad-forge-1.20.1-1.0.4.jar
          ORIGINAL_SHA="$(sha256sum ec_ad-forge-1.20.1-1.0.4.jar | cut -d' ' -f1)"
          test "$ORIGINAL_SHA" = "8df20e08d46f778a6e975b60b0cc7e19ff674264834812015537d7ef0fb121b1"
          echo "Immutable original input hash verified."
          echo "Original JAR SHA-256: $ORIGINAL_SHA"

      - name: Download ASM bytecode tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/tools
          curl --fail --location --retry 3 \
            https://repo.maven.apache.org/maven2/org/ow2/asm/asm/9.7.1/asm-9.7.1.jar \
            -o build/tools/asm-9.7.1.jar
          curl --fail --location --retry 3 \
            https://repo.maven.apache.org/maven2/org/ow2/asm/asm-tree/9.7.1/asm-tree-9.7.1.jar \
            -o build/tools/asm-tree-9.7.1.jar

      - name: Compile direct bytecode pruner
        shell: bash
        run: |
          set -euo pipefail
          CP="build/tools/asm-9.7.1.jar:build/tools/asm-tree-9.7.1.jar"
          javac -encoding UTF-8 -cp "$CP" -d build/tools tools/JarPruner.java

      - name: Decompress and compile isolated Legacy behavior hooks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/behavior-hooks
          cat tools/LegacyBehaviorHooks.part1.b64 tools/LegacyBehaviorHooks.part2.b64 tools/LegacyBehaviorHooks.part3.b64 tools/LegacyBehaviorHooks.part4.b64 | base64 -d | gzip -dc > build/LegacyBehaviorHooks.java
          python3 tools/polish_legacy_hooks.py build/LegacyBehaviorHooks.java
          javac -encoding UTF-8 --release 17 -d build/behavior-hooks build/LegacyBehaviorHooks.java

      - name: Inspect Chorusoatl landing and Lushsaur warning hooks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path("build/LegacyBehaviorHooks.java").read_text(encoding="utf-8")
          signatures = list(re.finditer(
              r"(?ms)^    (?:public|private|protected)\s+[^;{}]*?\([^;{}]*?\)\s*(?:throws\s+[^{}]+)?\s*\{",
              source
          ))

          def extract(opening, start):
              depth = 0
              state = "code"
              escape = False
              pos = opening
              while pos < len(source):
                  ch = source[pos]
                  nxt = source[pos + 1] if pos + 1 < len(source) else ""
                  if state == "string":
                      if escape:
                          escape = False
                      elif ch == "\\\\":
                          escape = True
                      elif ch == '"':
                          state = "code"
                  elif state == "char":
                      if escape:
                          escape = False
                      elif ch == "\\\\":
                          escape = True
                      elif ch == "'":
                          state = "code"
                  elif state == "line":
                      if ch == "\\n":
                          state = "code"
                  elif state == "block":
                      if ch == "*" and nxt == "/":
                          state = "code"
                          pos += 1
                  else:
                      if ch == '"':
                          state = "string"
                      elif ch == "'":
                          state = "char"
                      elif ch == "/" and nxt == "/":
                          state = "line"
                          pos += 1
                      elif ch == "/" and nxt == "*":
                          state = "block"
                          pos += 1
                      elif ch == "{":
                          depth += 1
                      elif ch == "}":
                          depth -= 1
                          if depth == 0:
                              return source[start:pos + 1]
                  pos += 1
              raise RuntimeError("Unclosed Java block")

          topics = {
              "LUSHS warning/reaction": (
                  "warning", "Warning", "berriesSeen", "territor", "roar", "Roar",
                  "tail", "Tail", "anger", "aggress", "warningCount", "warningLevel",
                  "queueActions", "actionRoar", "actionAttackTailStomp"
              ),
              "CHORUS landing/route": (
                  "chorusoatlTick", "PREPARING_TO_LAND", "validPlatform",
                  "overlapsOtherChorusoatl", "nextPathUpdate", "FlyNavigation",
                  "SmoothPathNavigation", "moveTo(", "m_26519_", "navigation",
                  "landing", "Landing"
              ),
          }
          output = []
          found = {topic: [] for topic in topics}
          for match in signatures:
              block = extract(source.find("{", match.start(), match.end()), match.start())
              for topic, tokens in topics.items():
                  if any(token in block for token in tokens):
                      found[topic].append(block)
          for topic, blocks in found.items():
              output.append("===== %s: %d methods =====" % (topic, len(blocks)))
              output.extend(blocks)
              output.append("")

          lines = source.splitlines()
          for term in ("WARNING_WINDOW", "class WarningData", "class LushState", "queueActions"):
              indexes = [i for i, line in enumerate(lines) if term in line]
              output.append("===== SOURCE DECLARATIONS: %s (%d hits) =====" % (term, len(indexes)))
              for i in indexes:
                  output.append("\n".join(lines[max(0, i - 2):min(len(lines), i + 12)]))
          report = "\n\n".join(output)
          Path("build/chorusoatl-lush-warning-diagnostics.txt").write_text(report, encoding="utf-8")
          print(report)
          PY

      - name: Inspect original Lushsaur actions and path navigation
        shell: bash
        run: |
          set -euo pipefail
          JAR="ec_ad-forge-1.20.1-1.0.4.jar"
          python3 - "$JAR" > build/inspect-classes.txt <<'PY'
          import sys
          import zipfile

          jar = sys.argv[1]
          with zipfile.ZipFile(jar) as archive:
              names = [name[:-6].replace("/", ".") for name in archive.namelist() if name.endswith(".class")]
              relevant = sorted(name for name in names if any(term in name for term in (
                  "LushsaurEntity", "LushsaurAI", "FlyNavigation",
                  "SmoothPathNavigation", "SmartPathFinder",
                  "GoalChargeMeleeAttack", "WrappedAction",
                  "GoalActionMeleeAttack", "GoalRandomAction"
              )))
              print("\n".join(relevant))
              print("===== ACTION STRING REFERENCES =====")
              for name in archive.namelist():
                  if not name.endswith(".class"):
                      continue
                  data = archive.read(name)
                  if b"actionRoar" in data or b"actionAttackTailStomp" in data:
                      print(name + " roar=" + str(b"actionRoar" in data) +
                            " tailStomp=" + str(b"actionAttackTailStomp" in data))
          PY
          while IFS= read -r class_name; do
            case "$class_name" in
              com.*)
                echo "===== JAVAP $class_name ====="
                javap -classpath "$JAR" -p -c -s "$class_name" || true
                ;;
            esac
          done < build/inspect-classes.txt > build/original-lush-navigation-javap.txt
          cat build/original-lush-navigation-javap.txt
          cat build/inspect-classes.txt

      - name: Upload temporary AI diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: legacy-ai-diagnostics-build47
          path: |
            build/chorusoatl-lush-warning-diagnostics.txt
            build/original-lush-navigation-javap.txt
            build/inspect-classes.txt
          if-no-files-found: error
          retention-days: 1

      - name: Prune classes and registrations in the original JAR
        shell: bash
        run: |
          set -euo pipefail
          CP="build/tools:build/tools/asm-9.7.1.jar:build/tools/asm-tree-9.7.1.jar"
          java -cp "$CP" JarPruner \
            ec_ad-forge-1.20.1-1.0.4.jar \
            build/classes-pruned.jar
          jar uf build/classes-pruned.jar -C build/behavior-hooks .
          mkdir -p build/worldgen-reobfuscated
          python3 - "worldgen/build/libs/legacy-worldgen-1.0.0.jar" build/worldgen-reobfuscated <<'PY'
          import pathlib
          import sys
          import zipfile

          source = pathlib.Path(sys.argv[1])
          target = pathlib.Path(sys.argv[2])
          required = {
              "end_peaks.mixins.json",
              "end_peaks.refmap.json",
          }
          copied = set()
          with zipfile.ZipFile(source) as archive:
              for name in archive.namelist():
                  if not (name.endswith(".class") or name in required):
                      continue
                  if name.startswith("META-INF/"):
                      continue
                  destination = target / name
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(archive.read(name))
                  copied.add(name)
          missing = sorted(required - copied)
          if missing:
              raise SystemExit("Reobfuscated worldgen JAR is missing Mixin resources: " + repr(missing))
          if not any(name.endswith("EndPeaksFeatureRegistry.class") for name in copied):
              raise SystemExit("Reobfuscated worldgen JAR contains no EndPeaksFeatureRegistry class.")
          print("Merged %d reobfuscated worldgen classes/resources." % len(copied))
          PY
          jar uf build/classes-pruned.jar -C build/worldgen-reobfuscated .

      - name: Prune resources inside the JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/libs
          python3 tools/prune_binary_jar.py \
            build/classes-pruned.jar \
            build/libs/archie_dinosaurs-legacy-forge-1.20.1.jar

      - name: Verify End Peaks biome generation and Chorusoatl population
        shell: bash
        run: |
          set -euo pipefail

          JAR="build/libs/archie_dinosaurs-legacy-forge-1.20.1.jar"
          for entry in \
            'com/eternal_creations/archies_dino_mod/mixin/EndPeaksBiomeSourceMixin.class' \
            'com/eternal_creations/archies_dino_mod/mixin/EndPeaksHolderReferenceAccessor.class' \
            'com/eternal_creations/archies_dino_mod/worldgen/EndPeaksWorldgen.class' \
            'com/eternal_creations/archies_dino_mod/worldgen/EndPeaksMountainFeature.class' \
            'com/eternal_creations/archies_dino_mod/worldgen/EndPeaksChorusFeature.class' \
            'com/eternal_creations/archies_dino_mod/worldgen/EndPeaksChorusoatlSpawnLimiter.class' \
            'com/eternal_creations/archies_dino_mod/worldgen/EndPeaksFeatureRegistry.class' \
            'end_peaks.mixins.json' \
            'end_peaks.refmap.json'; do
            if ! jar tf "$JAR" | grep -Fxq "$entry"; then
              echo "End Peaks runtime resource is missing: $entry"
              exit 1
            fi
          done

          python3 - <<'PY'
          import json
          import zipfile

          path = "build/libs/archie_dinosaurs-legacy-forge-1.20.1.jar"
          with zipfile.ZipFile(path) as jar:
              names = set(jar.namelist())
              modifier = json.loads(jar.read("data/archie_dinosaurs/forge/biome_modifier/chorusoatl_spawns.json"))
              assert modifier["biomes"] == "archie_dinosaurs:end_peaks"
              assert modifier["spawners"] == {
                  "type": "archie_dinosaurs:chorusoatl",
                  "weight": 1,
                  "minCount": 3,
                  "maxCount": 5,
              }

              spawn_tag = json.loads(jar.read("data/archie_dinosaurs/tags/worldgen/biome/spawns_chorusoatls.json"))
              assert spawn_tag == {"replace": True, "values": ["archie_dinosaurs:end_peaks"]}

              biome = json.loads(jar.read("data/archie_dinosaurs/worldgen/biome/end_peaks.json"))
              assert biome["carvers"] == {}
              assert biome["effects"] == {
                  "fog_color": 10518688,
                  "sky_color": 0,
                  "water_color": 4159204,
                  "water_fog_color": 329011,
              }
              assert "archie_dinosaurs:end_peaks_mountains" in biome["features"][4]
              assert "minecraft:end_gateway_return" in biome["features"][4]
              assert biome["features"][9] == ["archie_dinosaurs:end_peaks_chorus"]

              config = json.loads(jar.read("end_peaks.mixins.json"))
              assert config["mixins"] == ["EndPeaksBiomeSourceMixin", "EndPeaksHolderReferenceAccessor"]
              refmap = json.loads(jar.read("end_peaks.refmap.json"))
              manifest = jar.read("META-INF/MANIFEST.MF").decode("utf-8")
              assert "end_peaks.mixins.json" in manifest

              for tag_path in (
                  "data/minecraft/tags/worldgen/biome/is_end.json",
                  "data/minecraft/tags/worldgen/biome/has_structure/end_city.json",
              ):
                  tag = json.loads(jar.read(tag_path))
                  assert tag.get("replace") is False
                  assert "archie_dinosaurs:end_peaks" in tag.get("values", [])

          print("Verified End Peaks generation resources, End structure tags, and Chorusoatl's 2-group/3-5 population settings.")
          PY

          CHORUS_LIMITER="$(javap -classpath "$JAR" -p -c com.eternal_creations.archies_dino_mod.worldgen.EndPeaksChorusoatlSpawnLimiter)"
          if ! grep -Fq 'MobSpawnType.NATURAL' worldgen/src/main/java/com/eternal_creations/archies_dino_mod/worldgen/EndPeaksChorusoatlSpawnLimiter.java; then
            echo "Chorusoatl population limiter must only gate MobSpawnType.NATURAL."
            exit 1
          fi
          for required in 'MAX_ACTIVE_GROUPS' 'setSpawnCancelled'; do
            if ! grep -Fq "$required" <<< "$CHORUS_LIMITER"; then
              echo "Chorusoatl natural group limiter is missing required behavior: $required"
              printf '%s\n' "$CHORUS_LIMITER"
              exit 1
            fi
          done
          echo "Verified two active Chorusoatl natural spawn groups per local End Peaks area."
      - name: Verify Sculksaur multipart hitboxes
        shell: bash
        run: |
          set -euo pipefail

          JAR="build/libs/archie_dinosaurs-legacy-forge-1.20.1.jar"
          SCULK_CLASS='com.eternal_creations.archies_dino_mod.common.entity.mob.sculksaur.SculksaurEntity'
          SCULK="$(javap -classpath "$JAR" -p -c "$SCULK_CLASS")"
          SCULK_METHODS="$(javap -classpath "$JAR" -p -s "$SCULK_CLASS")"
          SCULK_VERBOSE="$(javap -classpath "$JAR" -p -v "$SCULK_CLASS")"

          for entry in \
            'com/eternal_creations/archies_dino_mod/common/entity/base/IMultipartEntity.class' \
            'com/eternal_creations/archies_dino_mod/common/entity/base/IPartEntity.class' \
            'com/eternal_creations/archies_dino_mod/common/entity/base/SimplePart.class' \
            'com/eternal_creations/archies_dino_mod/entity/ForgeEntityPart.class' \
            'com/eternal_creations/archies_dino_mod/mixin/EntityAccessor.class' \
            'com/eternal_creations/archies_dino_mod/mixin/forge/ForgeEntityMultipartMixin.class'; do
            if ! jar tf "$JAR" | grep -Fxq "$entry"; then
              echo "Sculksaur multipart dependency is missing: $entry"
              exit 1
            fi
          done

          if ! grep -Fq 'com/eternal_creations/archies_dino_mod/common/entity/base/IMultipartEntity' <<< "$SCULK_VERBOSE"; then
            echo "SculksaurEntity class metadata does not declare IMultipartEntity."
            exit 1
          fi

          for part in neck1 neck2 tail1 tail2; do
            if ! grep -Fq " $part;" <<< "$SCULK_METHODS"; then
              echo "Sculksaur multipart field is missing: $part"
              exit 1
            fi
          done
          if ! grep -Fq ' parts;' <<< "$SCULK_METHODS"; then
            echo "Sculksaur IPartEntity array field is missing."
            exit 1
          fi

          CONSTRUCTOR_PARTS="$(grep -oF 'SimplePart."<init>"' <<< "$SCULK" | wc -l | tr -d ' ')"
          if [[ "$CONSTRUCTOR_PARTS" != "4" ]]; then
            echo "Expected four SimplePart constructor calls, found $CONSTRUCTOR_PARTS"
            exit 1
          fi
          PART_TICKS="$(grep -oF 'SimplePart.tick:()V' <<< "$SCULK" | wc -l | tr -d ' ')"
          if [[ "$PART_TICKS" != "4" ]]; then
            echo "Expected four per-tick SimplePart updates, found $PART_TICKS"
            exit 1
          fi
          if ! grep -Fq 'SimplePart.collectEntities:' <<< "$SCULK"; then
            echo "Sculksaur multipart IDs are not initialized through collectEntities."
            exit 1
          fi

          for method in 'getIParts' 'hurtFromPart' 'interactFromPart'; do
            if ! grep -Fq " $method(" <<< "$SCULK_METHODS"; then
              echo "Sculksaur multipart callback is missing: $method"
              exit 1
            fi
          done
          if ! grep -Fq 'm_6469_:(Lnet/minecraft/world/damagesource/DamageSource;F)Z' <<< "$SCULK"; then
            echo "Multipart damage is not delegated to the parent Sculksaur."
            exit 1
          fi
          if ! grep -Fq 'm_6071_:(Lnet/minecraft/world/entity/player/Player;Lnet/minecraft/world/InteractionHand;)Lnet/minecraft/world/InteractionResult;' <<< "$SCULK"; then
            echo "Multipart interaction is not delegated to the parent Sculksaur."
            exit 1
          fi

          SIMPLE_PART="$(javap -classpath "$JAR" -p -c com.eternal_creations.archies_dino_mod.common.entity.base.SimplePart)"
          if ! grep -Fq 'ICommonHelper.makePartEntity' <<< "$SIMPLE_PART"; then
            echo "SimplePart is not creating the Forge part entities through ICommonHelper."
            exit 1
          fi

          python3 - "$JAR" <<'PY'
          import json
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as jar:
              config = json.loads(jar.read("archie_dinosaurs.forge.mixins.json"))
          mixins = config.get("mixins", [])
          if "forge.ForgeEntityMultipartMixin" not in mixins:
              raise SystemExit("ForgeEntityMultipartMixin is not registered in the Forge mixin config.")
          print("Verified Forge multipart mixin registration.")
          PY

          echo "Verified Sculksaur's two neck and two tail hitboxes, update loop, part ID allocation, damage/interact delegation, and Forge integration."

      - name: Audit original and retained mob turn controllers
        shell: bash
        run: |
          set -euo pipefail

          dump_method() {
            local jar="$1"
            local class="$2"
            local method="$3"
            echo "===== $jar :: $class :: $method ====="
            javap -classpath "$jar" -p -c "$class" | awk -v method="$method" '
              index($0, method) > 0 { capture=1 }
              capture { print }
              capture && NF == 0 { exit }
            '
          }

          ORIGINAL_JAR="ec_ad-forge-1.20.1-1.0.4.jar"
          PRUNED_JAR="build/classes-pruned.jar"

          for JAR in "$ORIGINAL_JAR" "$PRUNED_JAR"; do
            dump_method "$JAR" com.eternal_creations.archies_dino_mod.common.entity.ai.control.SmoothMoveControl 'tick3DMovement('
            dump_method "$JAR" com.eternal_creations.archies_dino_mod.common.entity.ai.control.SmoothMoveControl 'tickClimber('
            dump_method "$JAR" com.eternal_creations.archies_dino_mod.common.entity.ai.control.SmoothMoveControl 'tickWalker('
            dump_method "$JAR" com.eternal_creations.archies_dino_mod.common.entity.ai.control.SmoothMoveControl 'smoothRotlerp('
            dump_method "$JAR" com.eternal_creations.archies_dino_mod.common.entity.ai.control.SmoothBodyControl 'm_8121_('
            dump_method "$JAR" com.eternal_creations.archies_dino_mod.common.entity.ai.control.SmoothLookControl 'm_8128_('
          done

      - name: Verify retained renderer method descriptors
        shell: bash
        run: |
          set -euo pipefail
          PROVIDER_DESC='()Lcom/astemir/astemirlib/re/client/model/render/renderer/AstemirEntityRenderer$Provider;'
          for class_name in \
            com.eternal_creations.archies_dino_mod.client.model.render.entity.mob.LushsaurClient \
            com.eternal_creations.archies_dino_mod.client.model.render.entity.mob.ChorusoatlClient \
            com.eternal_creations.archies_dino_mod.client.model.render.entity.mob.SculksaurClient
          do
            javap -classpath build/classes-pruned.jar -p -s "$class_name" | grep -F "descriptor: $PROVIDER_DESC"
          done
          RENDER_CALLS="$(javap -classpath build/classes-pruned.jar -p -c com.eternal_creations.archies_dino_mod.client.CommonClient)"
          COUNT="$(printf '%s\n' "$RENDER_CALLS" | grep -F -o "createRenderProvider:$PROVIDER_DESC" | wc -l)"
          test "$COUNT" -eq 3
          if printf '%s\n' "$RENDER_CALLS" | grep -F "createRenderProvider:()Lnet/minecraft/client/renderer/entity/EntityRendererProvider;"; then
            echo "Found stale renderer descriptor in CommonClient."
            exit 1
          fi
          if ! printf '%s\n' "$RENDER_CALLS" | grep -F "m_174009_:()Lnet/minecraft/client/renderer/entity/EntityRendererProvider;"; then
            echo "Missing correctly named EntityRendererProvider lambda SAM."
            exit 1
          fi
          if printf '%s\n' "$RENDER_CALLS" | grep -F "get:()Lnet/minecraft/client/renderer/entity/EntityRendererProvider;"; then
            echo "Found invalid EntityRendererProvider lambda SAM name."
            exit 1
          fi
          EGG_RENDERER_DESC='(Lcom/astemir/astemirlib/re/client/model/AstemirModel;)Lcom/astemir/astemirlib/re/client/model/render/renderer/AstemirBlockEntityRenderer;'
          EGG_CLIENT='com.eternal_creations.archies_dino_mod.client.model.render.block.DinoEggClient'
