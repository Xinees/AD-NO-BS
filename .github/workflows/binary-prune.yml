name: Direct Legacy JAR Prune - build 4

on:
  push:
    branches:
      - binary-prune/legacy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout binary workspace
        uses: actions/checkout@v4
        with:
          ref: binary-prune/legacy

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify untouched source JAR
        shell: bash
        run: |
          set -euo pipefail
          test -s ec_ad-forge-1.20.1-1.0.4.jar
          echo "Original JAR SHA-256:"
          sha256sum ec_ad-forge-1.20.1-1.0.4.jar
          echo "Astemir RE input SHA-256:"
          sha256sum astemirlib_re-1.20.1-forge-1.2.98-SNAPSHOT.jar

      - name: Download ASM bytecode tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/tools
          curl --fail --location --retry 3 \
            https://repo.maven.apache.org/maven2/org/ow2/asm/asm/9.7.1/asm-9.7.1.jar \
            -o build/tools/asm-9.7.1.jar
          curl --fail --location --retry 3 \
            https://repo.maven.apache.org/maven2/org/ow2/asm/asm-tree/9.7.1/asm-tree-9.7.1.jar \
            -o build/tools/asm-tree-9.7.1.jar

      - name: Compile direct bytecode pruner
        shell: bash
        run: |
          set -euo pipefail
          CP="build/tools/asm-9.7.1.jar:build/tools/asm-tree-9.7.1.jar"
          javac -encoding UTF-8 -cp "$CP" -d build/tools tools/JarPruner.java

      - name: Prune classes and registrations in the original JAR
        shell: bash
        run: |
          set -euo pipefail
          CP="build/tools:build/tools/asm-9.7.1.jar:build/tools/asm-tree-9.7.1.jar"
          java -cp "$CP" JarPruner \
            ec_ad-forge-1.20.1-1.0.4.jar \
            build/classes-pruned.jar

      - name: Prune resources inside the JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/libs
          python3 tools/prune_binary_jar.py \
            build/classes-pruned.jar \
            build/libs/ec_ad-legacy-forge-1.20.1.jar

      - name: Embed untouched Astemir RE as Jar-in-Jar
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/embed_astemir_jar.py \
            build/libs/ec_ad-legacy-forge-1.20.1.jar \
            astemirlib_re-1.20.1-forge-1.2.98-SNAPSHOT.jar \
            build/libs/ec_ad-legacy-forge-1.20.1.jar

      - name: Verify Legacy JAR structure and retained content
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          import json
          import hashlib

          jar = Path("build/libs/ec_ad-legacy-forge-1.20.1.jar")
          with zipfile.ZipFile(jar) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"Corrupt ZIP entry: {bad}")

              names = set(z.namelist())
              required = {
                  "META-INF/jarjar/metadata.json",
                  "META-INF/jarjar/astemirlib_re-1.20.1-forge-1.2.98-SNAPSHOT.jar",
                  "META-INF/mods.toml",
                  "ec_ad.mixins.json",
                  "ec_ad.forge.mixins.json",
                  "pack.mcmeta",
                  "com/eternal_creations/archies_dino_mod/ArchiesDinosaurs.class",
                  "com/eternal_creations/archies_dino_mod/common/entity/mob/lushsaur/LushsaurEntity.class",
                  "com/eternal_creations/archies_dino_mod/common/entity/mob/chorusoatl/ChorusoatlEntity.class",
                  "com/eternal_creations/archies_dino_mod/common/entity/mob/sculksaur/SculksaurEntity.class",
                  "com/eternal_creations/archies_dino_mod/common/block/eggs/LushsaurEggBlock.class",
                  "com/eternal_creations/archies_dino_mod/common/block/eggs/ChorusoatlEggBlock.class",
                  "assets/ec_ad/models/item/lush_core.json",
                  "assets/ec_ad/models/item/chorus_fossil.json",
                  "assets/ec_ad/models/item/sculk_toxin.json",
                  "assets/ec_ad/models/item/lushsaur_spawn_egg.json",
                  "assets/ec_ad/models/item/chorusoatl_spawn_egg.json",
                  "assets/ec_ad/models/item/sculksaur_spawn_egg.json",
                  "assets/ec_ad/models/block/lushsaur_egg.json",
                  "assets/ec_ad/models/block/chorusoatl_egg.json",
              }
              nested_library = "META-INF/jarjar/astemirlib_re-1.20.1-forge-1.2.98-SNAPSHOT.jar"
              expected_library_hash = "906198b220958f352c308ec9a2178342b7af90198ade206d1596eb336a89a0a3"
              metadata = json.loads(z.read("META-INF/jarjar/metadata.json"))
              matches = [
                  entry for entry in metadata.get("jars", [])
                  if entry.get("path") == nested_library
              ]
              if len(matches) != 1:
                  raise SystemExit("Astemir RE Jar-in-Jar metadata entry is missing or duplicated")
              embedded_hash = hashlib.sha256(z.read(nested_library)).hexdigest()
              if embedded_hash != expected_library_hash:
                  raise SystemExit(f"Embedded Astemir RE hash mismatch: {embedded_hash}")
              mods_toml = z.read("META-INF/mods.toml").decode("utf-8")
              if 'modId = "astemirlib_re"' not in mods_toml:
                  raise SystemExit("Parent mod no longer declares its Astemir RE dependency")

              missing = sorted(required - names)
              if missing:
                  raise SystemExit("Missing required Legacy entries:\n" + "\n".join(missing))

              forbidden_parts = (
                  "/common/entity/mob/archie/",
                  "/common/entity/mob/coralosaur/",
                  "/common/entity/mob/obsidiceratops/",
                  "/common/entity/mob/sculkraptor/",
                  "/common/entity/mob/therimoss/",
                  "/common/items/weapon/",
                  "/common/items/armor/",
                  "/client/screen/guidebook/",
                  "LushsaurMace",
                  "PusTippedArrowEntity",
              )
              leftovers = sorted(
                  name for name in names
                  if name.endswith(".class") and any(part in name for part in forbidden_parts)
              )
              if leftovers:
                  raise SystemExit("Unexpected classes left in JAR:\n" + "\n".join(leftovers))

              banned_assets = (
                  "lush_mace", "ooze_tipped_arrow", "chorus_scythe", "rib_bow",
                  "sculk_bow", "scorching_horn", "therimoss_claws",
                  "coralosaur", "obsidiceratops", "sculkraptor", "therimoss", "archie",
              )
              extra_assets = sorted(
                  name for name in names
                  if name.startswith("assets/ec_ad/") and any(token in name.lower() for token in banned_assets)
              )
              if extra_assets:
                  raise SystemExit("Unexpected assets left in JAR:\n" + "\n".join(extra_assets))

              print(f"Verified {len(names)} entries in {jar}")
              print(f"Final size: {jar.stat().st_size} bytes")
          PY

      - name: Forge 1.20.1 server smoke test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/smoke
          curl --fail --location --retry 3 \
            https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.28/forge-1.20.1-47.4.28-installer.jar \
            -o build/forge-installer.jar
          (
            cd build/smoke
            java -jar ../forge-installer.jar --installServer
          )
          mkdir -p build/smoke/mods
          cp build/libs/ec_ad-legacy-forge-1.20.1.jar build/smoke/mods/
          python3 - <<'PY'
          import io
          import json
          import os
          from pathlib import Path
          import tempfile
          import zipfile

          smoke_jar = Path("build/smoke/mods/ec_ad-legacy-forge-1.20.1.jar")
          nested_name = "META-INF/jarjar/astemirlib_re-1.20.1-forge-1.2.98-SNAPSHOT.jar"

          def strip_manifest(data):
              lines = data.decode("utf-8", errors="replace").splitlines()
              kept = []
              skip_continuation = False
              for line in lines:
                  if not line.startswith(" ") and line.lower().startswith("mixinconfigs:"):
                      skip_continuation = True
                      continue
                  if skip_continuation and line.startswith(" "):
                      continue
                  skip_continuation = False
                  kept.append(line)
              return ("\r\n".join(kept) + "\r\n\r\n").encode("utf-8")

          def strip_nested_mixins(data):
              src = io.BytesIO(data)
              dst = io.BytesIO()
              with zipfile.ZipFile(src, "r") as original, zipfile.ZipFile(dst, "w", zipfile.ZIP_DEFLATED) as changed:
                  for info in original.infolist():
                      content = original.read(info.filename)
                      if info.filename == "META-INF/MANIFEST.MF":
                          content = strip_manifest(content)
                      changed.writestr(info, content)
              return dst.getvalue()

          with zipfile.ZipFile(smoke_jar, "r") as original:
              entries = [(info, original.read(info.filename)) for info in original.infolist()]
          fd, temp_name = tempfile.mkstemp(prefix="smoke-no-mixins-", suffix=".jar", dir=smoke_jar.parent)
          os.close(fd)
          try:
              with zipfile.ZipFile(temp_name, "w", zipfile.ZIP_DEFLATED) as changed:
                  for info, content in entries:
                      # Keep only the criterion accessor to isolate the parent mixin causing early ASM failure.
                      if info.filename == "ec_ad.mixins.json":
                          config = json.loads(content.decode("utf-8"))
                          config["mixins"] = [
                              "CriteriaTriggersAccessor",
                              "BreedGoalAccessor",
                              "EntityAccessor",
                              "PlayerListMixin",
                              "sculksaur.PrimaryLevelDataMixin",
                              "sculksaur.SculkShriekerBlockEntityMixin",
                              "sculksaur.WalkNodeEvaluatorAccessor",
                              "sculksaur.WardenMixin",
                              "AbstractArrowMixin",
                          ]
                          config["client"] = []
                          config["server"] = []
                          content = (json.dumps(config, indent=2) + "\n").encode("utf-8")
                      # Keep the original Astemir RE manifest and MixinConfigs for this launch.
                      changed.writestr(info, content)
              os.replace(temp_name, smoke_jar)
          except Exception:
              Path(temp_name).unlink(missing_ok=True)
              raise

          print("Diagnostic-only smoke copy: required Sculksaur mixins plus arrow and mount accessors; PlayerMixin excluded; Astemir RE MixinConfigs enabled")
          PY
          printf 'eula=true\n' > build/smoke/eula.txt
          python3 - <<'PY'
          import pathlib
          import subprocess
          import time

          root = pathlib.Path("build/smoke")
          args_file = root / "libraries/net/minecraftforge/forge/1.20.1-47.4.28/unix_args.txt"
          if not args_file.is_file():
              raise SystemExit(f"Forge unix_args.txt missing: {args_file}")

          log_path = root / "server-smoke.log"
          command = [
              "java",
              "@user_jvm_args.txt",
              f"@{args_file.relative_to(root)}",
              "nogui",
          ]
          with log_path.open("w", encoding="utf-8") as log:
              process = subprocess.Popen(
                  command,
                  cwd=root,
                  stdin=subprocess.PIPE,
                  stdout=log,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              deadline = time.monotonic() + 150
              stop_sent = False
              while time.monotonic() < deadline:
                  if process.poll() is not None:
                      break
                  content = log_path.read_text(encoding="utf-8", errors="replace")
                  if "Done (" in content and not stop_sent:
                      process.stdin.write("stop\n")
                      process.stdin.flush()
                      stop_sent = True
                  time.sleep(1)

              if process.poll() is None:
                  process.terminate()
                  try:
                      process.wait(timeout=10)
                  except subprocess.TimeoutExpired:
                      process.kill()
                      process.wait()
                  raise SystemExit("Forge server did not shut down within smoke-test timeout")

              content = log_path.read_text(encoding="utf-8", errors="replace")
              print(content[-16000:])
              if not stop_sent:
                  raise SystemExit("Forge server never reached the Done startup marker")
              if process.returncode != 0:
                  raise SystemExit(f"Forge server exited with code {process.returncode}")
          PY

      - name: Upload Legacy JAR and debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ec-ad-legacy-forge-1.20.1-debug
          path: |
            build/classes-pruned.jar
            build/libs/ec_ad-legacy-forge-1.20.1.jar
            build/resource-prune-report.txt
            astemirlib_re-1.20.1-forge-1.2.98-SNAPSHOT.jar
            build/smoke/server-smoke.log
          if-no-files-found: ignore
          retention-days: 30
