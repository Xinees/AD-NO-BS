      - name: Verify Legacy JAR structure and retained content
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          import json
          import hashlib

          jar = Path("build/libs/archie_dinosaurs-legacy-forge-1.20.1.jar")
          with zipfile.ZipFile(jar) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"Corrupt ZIP entry: {bad}")

              names = set(z.namelist())
              sonic_boom_classes = sorted(
                  name for name in names
                  if name.endswith(".class") and "SculksaurSonicBoomParticle" in name
              )
              if sonic_boom_classes:
                  raise SystemExit("Removed Sculksaur explosion particle classes remain: " + ", ".join(sonic_boom_classes))
              for config_name in ("archie_dinosaurs.mixins.json", "archie_dinosaurs.forge.mixins.json"):
                  config = json.loads(z.read(config_name))
