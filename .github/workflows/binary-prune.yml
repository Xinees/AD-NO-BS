name: Direct Legacy JAR Prune - build 16

on:
  push:
    branches:
      - binary-prune/legacy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout binary workspace
        uses: actions/checkout@v4
        with:
          ref: binary-prune/legacy

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify untouched source JAR
        shell: bash
        run: |
          set -euo pipefail
          test -s ec_ad-forge-1.20.1-1.0.4.jar
          ORIGINAL_SHA="$(sha256sum ec_ad-forge-1.20.1-1.0.4.jar | cut -d' ' -f1)"
          test "$ORIGINAL_SHA" = "8df20e08d46f778a6e975b60b0cc7e19ff674264834812015537d7ef0fb121b1"
          echo "Immutable original input hash verified."
          echo "Original JAR SHA-256: $ORIGINAL_SHA"

      - name: Download ASM bytecode tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/tools
          curl --fail --location --retry 3 \
            https://repo.maven.apache.org/maven2/org/ow2/asm/asm/9.7.1/asm-9.7.1.jar \
            -o build/tools/asm-9.7.1.jar
          curl --fail --location --retry 3 \
            https://repo.maven.apache.org/maven2/org/ow2/asm/asm-tree/9.7.1/asm-tree-9.7.1.jar \
            -o build/tools/asm-tree-9.7.1.jar

      - name: Compile direct bytecode pruner
        shell: bash
        run: |
          set -euo pipefail
          CP="build/tools/asm-9.7.1.jar:build/tools/asm-tree-9.7.1.jar"
          javac -encoding UTF-8 -cp "$CP" -d build/tools tools/JarPruner.java

      - name: Prune classes and registrations in the original JAR
        shell: bash
        run: |
          set -euo pipefail
          CP="build/tools:build/tools/asm-9.7.1.jar:build/tools/asm-tree-9.7.1.jar"
          java -cp "$CP" JarPruner \
            ec_ad-forge-1.20.1-1.0.4.jar \
            build/classes-pruned.jar

      - name: Prune resources inside the JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/libs
          python3 tools/prune_binary_jar.py \
            build/classes-pruned.jar \
            build/libs/ec_ad-legacy-forge-1.20.1.jar

      - name: Verify retained renderer method descriptors
        shell: bash
        run: |
          set -euo pipefail
          PROVIDER_DESC='()Lcom/astemir/astemirlib/re/client/model/render/renderer/AstemirEntityRenderer$Provider;'
          for class_name in \
            com.eternal_creations.archies_dino_mod.client.model.render.entity.mob.LushsaurClient \
            com.eternal_creations.archies_dino_mod.client.model.render.entity.mob.ChorusoatlClient \
            com.eternal_creations.archies_dino_mod.client.model.render.entity.mob.SculksaurClient
          do
            javap -classpath build/classes-pruned.jar -p -s "$class_name" | grep -F "descriptor: $PROVIDER_DESC"
          done
          RENDER_CALLS="$(javap -classpath build/classes-pruned.jar -p -c com.eternal_creations.archies_dino_mod.client.CommonClient)"
          COUNT="$(printf '%s\\n' "$RENDER_CALLS" | grep -F -o "createRenderProvider:$PROVIDER_DESC" | wc -l)"
          test "$COUNT" -eq 3
          if printf '%s\\n' "$RENDER_CALLS" | grep -F "createRenderProvider:()Lnet/minecraft/client/renderer/entity/EntityRendererProvider;"; then
            echo "Found stale renderer descriptor in CommonClient."
            exit 1
          fi
          if ! printf '%s\\n' "$RENDER_CALLS" | grep -F "m_174009_:()Lnet/minecraft/client/renderer/entity/EntityRendererProvider;"; then
            echo "Missing correctly named EntityRendererProvider lambda SAM."
            exit 1
          fi
          if printf '%s\\n' "$RENDER_CALLS" | grep -F "get:()Lnet/minecraft/client/renderer/entity/EntityRendererProvider;"; then
            echo "Found invalid EntityRendererProvider lambda SAM name."
            exit 1
          fi
          EGG_RENDERER_DESC='(Lcom/astemir/astemirlib/re/client/model/AstemirModel;)Lcom/astemir/astemirlib/re/client/model/render/renderer/AstemirBlockEntityRenderer;'
          EGG_CLIENT='com.eternal_creations.archies_dino_mod.client.model.render.block.DinoEggClient'
          javap -classpath build/classes-pruned.jar -p -s "$EGG_CLIENT" | grep -F "descriptor: $EGG_RENDERER_DESC"
          BLOCK_RENDER_CALLS="$(javap -classpath build/classes-pruned.jar -p -c com.eternal_creations.archies_dino_mod.client.CommonClient)"
          BLOCK_COUNT="$(printf '%s\\n' "$BLOCK_RENDER_CALLS" | grep -F -o "createRenderer:$EGG_RENDERER_DESC" | wc -l)"
          test "$BLOCK_COUNT" -eq 2
          if printf '%s\\n' "$BLOCK_RENDER_CALLS" | grep -F "createRenderer:(Lcom/astemir/astemirlib/re/client/model/AstemirModel;)Lnet/minecraft/client/renderer/blockentity/BlockEntityRenderer;"; then
            echo "Found stale egg renderer descriptor in CommonClient."
            exit 1
          fi
          COMMON_CLIENT='com.eternal_creations.archies_dino_mod.client.CommonClient'
          BLOCK_HELPER_DESC='(Lcom/eternal_creations/archies_dino_mod/util/ResourceSupplier;Lnet/minecraft/client/renderer/blockentity/BlockEntityRenderer;)V'
          javap -classpath build/classes-pruned.jar -p -s "$COMMON_CLIENT" | grep -F "descriptor: $BLOCK_HELPER_DESC"
          BLOCK_HELPER_CALLS="$(printf '%s\\n' "$BLOCK_RENDER_CALLS" | grep -F -o "registerBlockEntityRenderer:$BLOCK_HELPER_DESC" | wc -l)"
          test "$BLOCK_HELPER_CALLS" -eq 2
          if printf '%s\\n' "$BLOCK_RENDER_CALLS" | grep -F "registerBlockEntityRenderer:(Ljava/util/function/Supplier;Lnet/minecraft/client/renderer/blockentity/BlockEntityRenderer;)V"; then
            echo "Found mismatched ResourceSupplier/Supplier block-entity renderer call."
            exit 1
          fi

      - name: Verify framework overrides, mounted attacks, and Lushsaur sprint controls
        shell: bash
        run: |
          set -euo pipefail

          verify_method() {
            local class_name="$1"
            local method_name="$2"
            local descriptor="$3"
            local output
            output="$(javap -classpath build/classes-pruned.jar -p -s "$class_name")"
            if ! printf '%s\\n' "$output" | grep -F -A1 "$method_name" | grep -Fq "descriptor: $descriptor"; then
              echo "Missing required callback $class_name.$method_name $descriptor"
              exit 1
            fi
          }

          verify_method 'com.eternal_creations.archies_dino_mod.client.model.system.ADModifiers$1' \
            'modify(' '(ILcom/astemir/astemirlib/re/client/model/core/animation/AnimationState;FFLcom/astemir/astemirlib/re/client/model/core/animation/BoneState;)V'
          verify_method 'com.eternal_creations.archies_dino_mod.common.menu.DinoMenu' \
            'm_6875_(' '(Lnet/minecraft/world/entity/player/Player;)Z'
          verify_method 'com.eternal_creations.archies_dino_mod.common.menu.DinoMenu' \
            'm_7648_(' '(Lnet/minecraft/world/entity/player/Player;I)Lnet/minecraft/world/item/ItemStack;'
          verify_method 'com.eternal_creations.archies_dino_mod.client.screen.DinoScreen' \
            'm_7286_(' '(Lnet/minecraft/client/gui/GuiGraphics;FII)V'
          verify_method 'com.eternal_creations.archies_dino_mod.networking.serverbound.MountControlMessage' \
            'execute(' '(Lnet/minecraft/server/level/ServerPlayer;)V'
          verify_method 'com.eternal_creations.archies_dino_mod.client.ADClientForgeBus' \
            'onClientTick(' '(Lnet/minecraftforge/event/TickEvent$ClientTickEvent;)V'
          verify_method 'com.eternal_creations.archies_dino_mod.client.ADClientForgeBus' \
            'lambda$onClientTick$0(' '(Lnet/minecraft/client/Minecraft;Lnet/minecraft/client/KeyMapping;Ljava/util/function/BiConsumer;)V'
          verify_method 'com.eternal_creations.archies_dino_mod.common.entity.mob.lushsaur.LushsaurEntity' \
            'onRiderAttack(' '(Lnet/minecraft/world/entity/LivingEntity;Lcom/eternal_creations/archies_dino_mod/common/entity/base/Mount$AttackType;)V'
          verify_method 'com.eternal_creations.archies_dino_mod.common.entity.mob.chorusoatl.ChorusoatlEntity' \
            'onRiderAttack(' '(Lnet/minecraft/world/entity/LivingEntity;Lcom/eternal_creations/archies_dino_mod/common/entity/base/Mount$AttackType;)V'
          verify_method 'com.eternal_creations.archies_dino_mod.common.entity.mob.lushsaur.LushsaurEntity' \
            'm_6688_(' '()Lnet/minecraft/world/entity/LivingEntity;'
          verify_method 'com.eternal_creations.archies_dino_mod.common.entity.mob.lushsaur.LushsaurEntity' \
            'm_264410_(' '()Z'
          verify_method 'com.eternal_creations.archies_dino_mod.mixin.client.LocalPlayerMixin' \
            'archiesDinoMod$allowLushsaurSprint(' '(Lnet/minecraft/world/entity/Entity;Lorg/spongepowered/asm/mixin/injection/callback/CallbackInfoReturnable;)V'

          LOCAL_PLAYER_SPRINT="$(javap -classpath build/classes-pruned.jar -p -c com.eternal_creations.archies_dino_mod.mixin.client.LocalPlayerMixin)"
          for required_call in 'LushsaurEntity.m_6688_' 'CallbackInfoReturnable.setReturnValue'; do
            if ! printf '%s\\n' "$LOCAL_PLAYER_SPRINT" | grep -Fq "$required_call"; then
              echo "LocalPlayer sprint gate is missing Lushsaur controller authorization: $required_call"
              printf '%s\\n' "$LOCAL_PLAYER_SPRINT"
              exit 1
            fi
          done

          LUSH_SPRINT_CONTROL="$(javap -classpath build/classes-pruned.jar -p -c com.eternal_creations.archies_dino_mod.common.entity.mob.lushsaur.LushsaurEntity)"
          if ! printf '%s\\n' "$LUSH_SPRINT_CONTROL" | grep -F -A5 'public boolean m_264410_();' | grep -Fq 'iconst_1'; then
            echo "Lushsaur canSprint override must return true for vanilla mounted sprint input."
            printf '%s\\n' "$LUSH_SPRINT_CONTROL"
            exit 1
          fi

          for entity_class in \
            com.eternal_creations.archies_dino_mod.common.entity.mob.chorusoatl.ChorusoatlEntity \
            com.eternal_creations.archies_dino_mod.common.entity.mob.sculksaur.SculksaurEntity; do
            if javap -classpath build/classes-pruned.jar -p "$entity_class" | grep -Fq 'm_264410_('; then
              echo "$entity_class unexpectedly received the Lushsaur-only sprint override."
              exit 1
            fi
          done

          LUSHSAUR_CLIENT='com.eternal_creations.archies_dino_mod.client.model.render.entity.mob.LushsaurClient'
          verify_method "$LUSHSAUR_CLIENT" \
            'archiesDinoMod$shouldUseRunAnimation(' \
            '(Lcom/eternal_creations/archies_dino_mod/common/entity/mob/lushsaur/LushsaurEntity;)Z'
          LUSH_GAIT="$(javap -classpath build/classes-pruned.jar -p -c "$LUSHSAUR_CLIENT")"
          for required_call in 'LushsaurEntity.m_6688_' 'LivingEntity.m_20142_' \
            'EntityLocomotion.whenRunning' 'Condition.check'; do
            if ! printf '%s\n' "$LUSH_GAIT" | grep -Fq "$required_call"; then
              echo "Lushsaur run animation gate is missing $required_call"
              printf '%s\n' "$LUSH_GAIT"
              exit 1
            fi
          done
          echo "The bytecode pruner itself verified exactly two replaced Lushsaur run-animation conditions."

          RIDER_ANIMATIONS='com.eternal_creations.archies_dino_mod.client.animation.player.riding.OnLushsaurPlayerAnimations'
          verify_method "$RIDER_ANIMATIONS" \
            'lambda$init$11(' \
            '(Lcom/eternal_creations/archies_dino_mod/common/entity/mob/lushsaur/LushsaurEntity;)Z'
          RIDER_RUN="$(javap -classpath build/classes-pruned.jar -p -c "$RIDER_ANIMATIONS" | sed -n '/lambda[$]init[$]11(/,/^  private static /p')"
          for required_call in 'LushsaurEntity.m_6688_' 'LivingEntity.m_20142_'; do
            if ! printf '%s\n' "$RIDER_RUN" | grep -Fq "$required_call"; then
              echo "Lushsaur rider run animation is not synchronized to the controlling passenger: $required_call"
              printf '%s\n' "$RIDER_RUN"
              exit 1
            fi
          done
          echo "Verified Lushsaur rider run animation reads controlling passenger sprint state."
          if printf '%s\n' "$RIDER_RUN" | grep -Fq 'getRunLocomotion'; then
            echo "Lushsaur rider run animation still uses the old velocity-based predicate."
            printf '%s\n' "$RIDER_RUN"
            exit 1
          fi

          LUSH_MOUNT_SPEED="$(printf '%s\\n' "$LUSH_SPRINT_CONTROL" | sed -n '/lambda[$]createMount[$]21(/,/lambda[$]createMount[$]20(/p')"
          for required_call in 'm_6688_' 'm_20142_' 'getSpeedBoostTicks' 'java/lang/Integer.signum' 'java/lang/Math.max'; do
            if ! printf '%s\\n' "$LUSH_MOUNT_SPEED" | grep -Fq "$required_call"; then
              echo "Lushsaur mount speed is missing expected walk/run or feed-boost logic: $required_call"
              printf '%s\\n' "$LUSH_MOUNT_SPEED"
              exit 1
            fi
          done

          LUSH_CONTROL="$(javap -classpath build/classes-pruned.jar -p -c com.eternal_creations.archies_dino_mod.common.entity.mob.lushsaur.LushsaurEntity)"
          for required_call in 'm_6254_' 'm_6688_' 'm_146895_' 'isAdult' 'isSitting' 'isOwnedBy'; do
            case "$LUSH_CONTROL" in
              *"$required_call"*) ;;
              *)
                echo "Lushsaur no-saddle controller is missing required guard/call: $required_call"
                printf '%s\\n' "$LUSH_CONTROL"
                exit 1
                ;;
            esac
          done
          CHORUS_CONTROL="$(javap -classpath build/classes-pruned.jar -p com.eternal_creations.archies_dino_mod.common.entity.mob.chorusoatl.ChorusoatlEntity)"
          if printf '%s\\n' "$CHORUS_CONTROL" | grep -Fq 'm_6688_('; then
            echo "Chorusoatl unexpectedly received the Lushsaur-only no-saddle override."
            exit 1
          fi

          MOUNT_CONTROL="$(javap -classpath build/classes-pruned.jar -p -c com.eternal_creations.archies_dino_mod.networking.serverbound.MountControlMessage)"
          if ! printf '%s\\n' "$MOUNT_CONTROL" | grep -Fq 'Mount.onRiderAttack'; then
            echo "MountControlMessage no longer dispatches rider attacks."
            exit 1
          fi

          ARROW_MIXIN="$(javap -classpath build/classes-pruned.jar -p -c -v com.eternal_creations.archies_dino_mod.mixin.AbstractArrowMixin)"
          if printf '%s\\n' "$ARROW_MIXIN" | grep -Fq 'archies_Dino_Mod$RIB_BOW_ARROW'; then
            echo "Removed rib-bow data accessor is still referenced by AbstractArrowMixin."
            exit 1
          fi

          TAB="$(javap -classpath build/classes-pruned.jar -p -c com.eternal_creations.archies_dino_mod.common.tab.ADCreativeTabs)"
          python3 - "$TAB" <<'PY'
          import sys
          tab = sys.argv[1]
          expected = [
              "LUSHSAUR_SPAWN_EGG",
              "CHORUSOATL_SPAWN_EGG",
              "SCULKSAUR_SPAWN_EGG",
              "LUSHSAUR_EGG",
              "CHORUSOATL_EGG",
              "LUSH_CORE",
              "SCULK_TOXIN",
              "CHORUS_FOSSIL",
          ]
          positions = [tab.find("ADItems." + name) for name in expected]
          if any(position < 0 for position in positions):
              raise SystemExit("Creative tab is missing one or more retained items")
          if positions != sorted(positions):
              raise SystemExit("Creative tab item order is incorrect: " + repr(positions))
          print("Verified creative tab order:", " -> ".join(expected))
          PY

      - name: Verify Legacy JAR structure and retained content
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          import json
          import hashlib

          jar = Path("build/libs/ec_ad-legacy-forge-1.20.1.jar")
          with zipfile.ZipFile(jar) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"Corrupt ZIP entry: {bad}")

              names = set(z.namelist())
              for config_name in ("ec_ad.mixins.json", "ec_ad.forge.mixins.json"):
                  config = json.loads(z.read(config_name))
                  package = config.get("package", "").replace(".", "/").strip("/")
                  for section in ("mixins", "client", "server"):
                      for mixin_name in config.get(section, []):
                          class_path = f"{package}/{mixin_name.replace('.', '/')}.class"
                          if class_path not in names:
                              raise SystemExit(f"{config_name} references missing mixin class {class_path}")

              required = {
                  "META-INF/jarjar/metadata.json",
                  "META-INF/jarjar/mixinextras-forge-0.4.1.jar",
                  "META-INF/mods.toml",
                  "ec_ad.mixins.json",
                  "ec_ad.forge.mixins.json",
                  "pack.mcmeta",
                  "com/eternal_creations/archies_dino_mod/ArchiesDinosaurs.class",
                  "com/eternal_creations/archies_dino_mod/common/entity/mob/lushsaur/LushsaurEntity.class",
                  "com/eternal_creations/archies_dino_mod/common/entity/mob/chorusoatl/ChorusoatlEntity.class",
                  "com/eternal_creations/archies_dino_mod/common/entity/mob/sculksaur/SculksaurEntity.class",
                  "com/eternal_creations/archies_dino_mod/common/block/eggs/LushsaurEggBlock.class",
                  "com/eternal_creations/archies_dino_mod/common/block/eggs/ChorusoatlEggBlock.class",
                  "assets/ec_ad/models/entity/lushsaur.astemirmodel",
                  "assets/ec_ad/models/entity/lushsaur_baby.astemirmodel",
                  "assets/ec_ad/models/entity/chorusoatl.astemirmodel",
                  "assets/ec_ad/models/entity/chorusoatl_baby.astemirmodel",
                  "assets/ec_ad/models/entity/sculksaur.astemirmodel",
                  "assets/ec_ad/models/block/lushsaur_egg.astemirmodel",
                  "assets/ec_ad/models/block/chorusoatl_egg.astemirmodel",
                  "assets/ec_ad/models/item/lush_core.json",
                  "assets/ec_ad/models/item/chorus_fossil.json",
                  "assets/ec_ad/models/item/sculk_toxin.json",
                  "assets/ec_ad/models/item/lushsaur_spawn_egg.json",
                  "assets/ec_ad/models/item/chorusoatl_spawn_egg.json",
                  "assets/ec_ad/models/item/sculksaur_spawn_egg.json",
                  "assets/ec_ad/models/block/lushsaur_egg.json",
                  "assets/ec_ad/models/block/chorusoatl_egg.json",
              }
              metadata = json.loads(z.read("META-INF/jarjar/metadata.json"))
              nested_astemir = [
                  name for name in names
                  if name.startswith("META-INF/jarjar/astemirlib_re-")
              ]
              if nested_astemir:
                  raise SystemExit("Astemir RE must be installed separately, not bundled: " + ", ".join(nested_astemir))
              for dependency in metadata.get("jars", []):
                  if dependency.get("identifier", {}).get("artifact") == "astemirlib_re":
                      raise SystemExit("Astemir RE must not be declared as a Jar-in-Jar dependency")
                  dependency_path = dependency.get("path")
                  if dependency_path not in names:
                      raise SystemExit(f"Jar-in-Jar metadata references missing file: {dependency_path}")
              mods_toml = z.read("META-INF/mods.toml").decode("utf-8")
              astemir_dependency = 'modId = "astemirlib_re"'
              if astemir_dependency not in mods_toml or 'mandatory = true' not in mods_toml:
                  raise SystemExit("Parent mod must keep Astemir RE as an external required dependency")

              missing = sorted(required - names)
              if missing:
                  raise SystemExit("Missing required Legacy entries:\n" + "\n".join(missing))

              forbidden_parts = (
                  "/common/entity/mob/archie/",
                  "/common/entity/mob/coralosaur/",
                  "/common/entity/mob/obsidiceratops/",
                  "/common/entity/mob/sculkraptor/",
                  "/common/entity/mob/therimoss/",
                  "/common/items/weapon/",
                  "/common/items/armor/",
                  "/client/screen/guidebook/",
                  "LushsaurMace",
                  "PusTippedArrowEntity",
              )
              leftovers = sorted(
                  name for name in names
                  if name.endswith(".class") and any(part in name for part in forbidden_parts)
              )
              if leftovers:
                  raise SystemExit("Unexpected classes left in JAR:\n" + "\n".join(leftovers))

              banned_assets = (
                  "lush_mace", "ooze_tipped_arrow", "chorus_scythe", "rib_bow",
                  "sculk_bow", "scorching_horn", "therimoss_claws",
                  "coralosaur", "obsidiceratops", "sculkraptor", "therimoss", "archie",
              )
              extra_assets = sorted(
                  name for name in names
                  if name.startswith("assets/ec_ad/") and any(token in name.lower() for token in banned_assets)
              )
              if extra_assets:
                  raise SystemExit("Unexpected assets left in JAR:\n" + "\n".join(extra_assets))

              print(f"Verified {len(names)} entries in {jar}")
              print(f"Final size: {jar.stat().st_size} bytes")
          PY

      - name: Upload pruned Legacy JAR
        uses: actions/upload-artifact@v4
        with:
          name: ec-ad-legacy-forge-1.20.1
          path: |
            build/libs/ec_ad-legacy-forge-1.20.1.jar
            build/resource-prune-report.txt
          if-no-files-found: error
          retention-days: 30

