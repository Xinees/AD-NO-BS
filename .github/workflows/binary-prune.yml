      - name: Verify Legacy JAR structure and retained content
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          import json
          import hashlib

          jar = Path("build/libs/archie_dinosaurs-legacy-forge-1.20.1.jar")
          with zipfile.ZipFile(jar) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"Corrupt ZIP entry: {bad}")

              names = set(z.namelist())
              sonic_boom_classes = sorted(
                  name for name in names
                  if name.endswith(".class") and "SculksaurSonicBoomParticle" in name
              )
              if sonic_boom_classes:
                  raise SystemExit("Removed Sculksaur explosion particle classes remain: " + ", ".join(sonic_boom_classes))
              for config_name in ("archie_dinosaurs.mixins.json", "archie_dinosaurs.forge.mixins.json"):
                  config = json.loads(z.read(config_name))
                  package = config.get("package", "").replace(".", "/").strip("/")
                  for section in ("mixins", "client", "server"):
                      for mixin_name in config.get(section, []):
                          class_path = f"{package}/{mixin_name.replace('.', '/')}.class"
                          if class_path not in names:
                              raise SystemExit(f"{config_name} references missing mixin class {class_path}")

              required = {
                  "META-INF/jarjar/metadata.json",
                  "META-INF/jarjar/mixinextras-forge-0.4.1.jar",
                  "META-INF/mods.toml",
                  "assets/archie_dinosaurs/lang/en_us.json",
                  "archie_dinosaurs.mixins.json",
                  "archie_dinosaurs.forge.mixins.json",
                  "pack.mcmeta",
                  "com/eternal_creations/archies_dino_mod/ArchiesDinosaurs.class",
                  "com/eternal_creations/archies_dino_mod/common/entity/mob/lushsaur/LushsaurEntity.class",
                  "com/eternal_creations/archies_dino_mod/common/entity/mob/chorusoatl/ChorusoatlEntity.class",
                  "com/eternal_creations/archies_dino_mod/common/entity/mob/sculksaur/SculksaurEntity.class",
                  "com/eternal_creations/archies_dino_mod/common/block/eggs/LushsaurEggBlock.class",
                  "com/eternal_creations/archies_dino_mod/common/block/eggs/ChorusoatlEggBlock.class",
                  "data/archie_dinosaurs/tags/blocks/chorusoatl_egg_hatchable.json",
                  "data/archie_dinosaurs/tags/dimension_type/chorusoatl_egg_preferred.json",
                  "assets/archie_dinosaurs/models/entity/lushsaur.astemirmodel",
                  "assets/archie_dinosaurs/models/entity/lushsaur_baby.astemirmodel",
                  "assets/archie_dinosaurs/models/entity/chorusoatl.astemirmodel",
                  "assets/archie_dinosaurs/models/entity/chorusoatl_baby.astemirmodel",
                  "assets/archie_dinosaurs/models/entity/sculksaur.astemirmodel",
                  "assets/archie_dinosaurs/models/block/lushsaur_egg.astemirmodel",
                  "assets/archie_dinosaurs/models/block/chorusoatl_egg.astemirmodel",
                  "assets/archie_dinosaurs/models/item/lush_core.json",
                  "assets/archie_dinosaurs/models/item/chorus_fossil.json",
                  "assets/archie_dinosaurs/models/item/sculk_toxin.json",
                  "assets/archie_dinosaurs/models/item/lushsaur_spawn_egg.json",
                  "assets/archie_dinosaurs/models/item/chorusoatl_spawn_egg.json",
                  "assets/archie_dinosaurs/models/item/sculksaur_spawn_egg.json",
                  "assets/archie_dinosaurs/models/block/lushsaur_egg.json",
                  "assets/archie_dinosaurs/models/block/chorusoatl_egg.json",
              }
              required_translations = {
                  "item_group.archie_dinosaurs_items",
                  "item.archie_dinosaurs.lushsaur_spawn_egg",
                  "item.archie_dinosaurs.chorusoatl_spawn_egg",
                  "item.archie_dinosaurs.sculksaur_spawn_egg",
                  "item.archie_dinosaurs.lush_core",
                  "item.archie_dinosaurs.chorus_fossil",
                  "item.archie_dinosaurs.sculk_toxin",
                  "block.archie_dinosaurs.lushsaur_egg",
                  "block.archie_dinosaurs.chorusoatl_egg",
              }
              for locale in ("en_us", "ru_ru"):
                  language_path = f"assets/archie_dinosaurs/lang/{locale}.json"
                  language = json.loads(z.read(language_path))
                  missing_translations = sorted(
                      key for key in required_translations
                      if not isinstance(language.get(key), str)
                      or not language[key].strip()
                      or language[key] == key
                  )
                  if missing_translations:
                      raise SystemExit(
                          f"Missing real {locale} translations: " + repr(missing_translations)
                      )

              hatchable_tag = json.loads(z.read("data/archie_dinosaurs/tags/blocks/chorusoatl_egg_hatchable.json"))
              expected_hatchable_blocks = {
                  "minecraft:end_stone",
                  "minecraft:end_stone_bricks",
                  "minecraft:purpur_block",
                  "minecraft:purpur_pillar",
                  "minecraft:obsidian",
                  "minecraft:bedrock",
              }
              missing_hatchable_blocks = sorted(expected_hatchable_blocks - set(hatchable_tag.get("values", [])))
              if missing_hatchable_blocks:
                  raise SystemExit("Chorusoatl egg hatchable tag is missing: " + ", ".join(missing_hatchable_blocks))
              preferred_dimensions = json.loads(z.read("data/archie_dinosaurs/tags/dimension_type/chorusoatl_egg_preferred.json"))
              if "minecraft:the_end" not in preferred_dimensions.get("values", []):
                  raise SystemExit("Chorusoatl preferred End dimension tag was lost")

              metadata = json.loads(z.read("META-INF/jarjar/metadata.json"))
              nested_astemir = [
                  name for name in names
                  if name.startswith("META-INF/jarjar/astemirlib_re-")
              ]
              if nested_astemir:
                  raise SystemExit("Astemir RE must be installed separately, not bundled: " + ", ".join(nested_astemir))
              for dependency in metadata.get("jars", []):
                  if dependency.get("identifier", {}).get("artifact") == "astemirlib_re":
                      raise SystemExit("Astemir RE must not be declared as a Jar-in-Jar dependency")
                  dependency_path = dependency.get("path")
                  if dependency_path not in names:
                      raise SystemExit(f"Jar-in-Jar metadata references missing file: {dependency_path}")
              mods_toml = z.read("META-INF/mods.toml").decode("utf-8")
              astemir_dependency = 'modId = "astemirlib_re"'
              if astemir_dependency not in mods_toml or 'mandatory = true' not in mods_toml:
                  raise SystemExit("Parent mod must keep Astemir RE as an external required dependency")
              if 'modId = "archie_dinosaurs"' not in mods_toml or 'modId = "ec_ad"' in mods_toml:
                  raise SystemExit("Forge metadata must identify this mod as archie_dinosaurs")

              stale_names = sorted(name for name in names if "ec_ad" in name)
              if stale_names:
                  raise SystemExit("Old mod identifier remains in JAR paths: " + ", ".join(stale_names))
              for entry_name in sorted(names):
                  if entry_name.endswith(".jar"):
                      continue
                  if b"ec_ad" in z.read(entry_name):
                      raise SystemExit(f"Old mod identifier remains in JAR contents: {entry_name}")

              missing = sorted(required - names)
              if missing:
                  raise SystemExit("Missing required Legacy entries:\n" + "\n".join(missing))

              forbidden_parts = (
                  "/common/entity/mob/archie/",
                  "/common/entity/mob/coralosaur/",
                  "/common/entity/mob/obsidiceratops/",
                  "/common/entity/mob/sculkraptor/",
                  "/common/entity/mob/therimoss/",
                  "/common/items/weapon/",
                  "/common/items/armor/",
                  "/client/screen/guidebook/",
                  "LushsaurMace",
                  "PusTippedArrowEntity",
              )
              leftovers = sorted(
                  name for name in names
                  if name.endswith(".class") and any(part in name for part in forbidden_parts)
              )
              if leftovers:
                  raise SystemExit("Unexpected classes left in JAR:\n" + "\n".join(leftovers))

              banned_assets = (
                  "lush_mace", "ooze_tipped_arrow", "chorus_scythe", "rib_bow",
                  "sculk_bow", "scorching_horn", "therimoss_claws",
                  "coralosaur", "obsidiceratops", "sculkraptor", "therimoss", "archie",
              )
              asset_prefix = "assets/archie_dinosaurs/"
              extra_assets = sorted(
                  name for name in names
                  if name.startswith(asset_prefix)
                  and any(token in name[len(asset_prefix):].lower() for token in banned_assets)
              )
              if extra_assets:
                  raise SystemExit("Unexpected assets left in JAR:\n" + "\n".join(extra_assets))

              print(f"Verified {len(names)} entries in {jar}")
              print(f"Final size: {jar.stat().st_size} bytes")
          PY

          
          python3 - <<'PY'
          import zipfile
          import json

          jar = "build/libs/archie_dinosaurs-legacy-forge-1.20.1.jar"
          expected = {
              "archie_dinosaurs:lushsaur",
              "archie_dinosaurs:chorusoatl",
              "archie_dinosaurs:sculksaur",
              "archie_dinosaurs:chorusoatl_spit",
          }
          found = set()
          old = {
              "ec_ad:lushsaur",
              "ec_ad:chorusoatl",
              "ec_ad:sculksaur",
              "ec_ad:chorusoatl_spit",
          }

          with zipfile.ZipFile(jar) as archive:
              for name in archive.namelist():
                  if not name.endswith(".json"):
                      continue
                  try:
                      value = json.loads(archive.read(name))
                  except (UnicodeDecodeError, json.JSONDecodeError):
                      continue

                  def visit(node):
                      if isinstance(node, dict):
                          for key, child in node.items():
                              if isinstance(key, str) and key.startswith("entity.ec_ad."):
                                  raise SystemExit(f"Old entity translation key remains: {name}: {key}")
                              if isinstance(key, str) and key.startswith("entity.archie_dinosaurs."):
                                  entity_name = key.split(".")[-1]
                                  translated_id = f"archie_dinosaurs:{entity_name}"
                                  if translated_id in expected:
                                      found.add(translated_id)
                              visit(child)
                      elif isinstance(node, list):
                          for child in node:
                              visit(child)
                      elif isinstance(node, str):
                          if node in old:
                              raise SystemExit(f"Old entity ID remains: {name}: {node}")
                          if node in expected:
                              found.add(node)

                  if name.startswith("assets/archie_dinosaurs/lang/") or name.startswith("data/archie_dinosaurs/"):
                      visit(value)

          missing = sorted(expected - found)
          if missing:
              raise SystemExit("Missing new entity registry references: " + repr(missing))
          print("Verified migrated entity IDs:", ", ".join(sorted(found)))
          PY

      - name: Publish validated Legacy JAR as a private draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="legacy-auto-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            build/libs/archie_dinosaurs-legacy-forge-1.20.1.jar \
            build/resource-prune-report.txt \
            --draft \
            --title "Legacy CI build #${GITHUB_RUN_NUMBER}" \
            --target "$GITHUB_SHA" \
            --notes "Automated draft build from branch binary-prune/legacy. Source commit: $GITHUB_SHA. Structurally validated CI build; not a final public release. Minecraft runtime acceptance testing is still required."

          while IFS= read -r old_tag; do
            [ -n "$old_tag" ] || continue
            [ "$old_tag" = "$TAG" ] && continue
            gh release delete "$old_tag" --yes
          done < <(
            gh release list --limit 100 --json tagName,isDraft \
              --jq '.[] | select(.isDraft == true and (.tagName | startswith("legacy-auto-"))) | .tagName'
          )

