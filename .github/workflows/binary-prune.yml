          verify_method 'com.eternal_creations.archies_dino_mod.networking.clientbound.SyncSettingsMessage' \
            'execute(' '()V'
          verify_method 'com.eternal_creations.archies_dino_mod.common.entity.projectile.PusTippedArrowEntity' \
