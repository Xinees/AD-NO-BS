          python3 - <<'PY'
          import zipfile
          import json

          jar = "build/libs/archie_dinosaurs-legacy-forge-1.20.1.jar"
          expected = {
              "archie_dinosaurs:lushsaur",
              "archie_dinosaurs:chorusoatl",
              "archie_dinosaurs:sculksaur",
              "archie_dinosaurs:chorusoatl_spit",
              "archie_dinosaurs:pus_tipped_arrow",
          }
          found = set()
          old = {
              "ec_ad:lushsaur",
              "ec_ad:chorusoatl",
              "ec_ad:sculksaur",
              "ec_ad:chorusoatl_spit",
              "ec_ad:pus_tipped_arrow",
          }

          with zipfile.ZipFile(jar) as archive:
              for name in archive.namelist():
                  if not name.endswith(".json"):
                      continue
                  try:
                      value = json.loads(archive.read(name))
                  except (UnicodeDecodeError, json.JSONDecodeError):
                      continue

                  def visit(node):
                      if isinstance(node, dict):
                          for key, child in node.items():
                              if isinstance(key, str) and key.startswith("entity.ec_ad."):
                                  raise SystemExit(f"Old entity translation key remains: {name}: {key}")
                              if isinstance(key, str) and key.startswith("entity.archie_dinosaurs."):
                                  entity_name = key.split(".")[-1]
                                  translated_id = f"archie_dinosaurs:{entity_name}"
                                  if translated_id in expected:
                                      found.add(translated_id)
                              visit(child)
                      elif isinstance(node, list):
                          for child in node:
                              visit(child)
                      elif isinstance(node, str):
                          if node in old:
                              raise SystemExit(f"Old entity ID remains: {name}: {node}")
                          if node in expected:
                              found.add(node)

                  if name.startswith("assets/archie_dinosaurs/lang/") or name.startswith("data/archie_dinosaurs/"):
                      visit(value)

          missing = sorted(expected - found)
          if missing:
              raise SystemExit("Missing new entity registry references: " + repr(missing))
          print("Verified migrated entity IDs:", ", ".join(sorted(found)))
          PY

      - name: Publish validated Legacy JAR as a private draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="legacy-auto-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            build/libs/archie_dinosaurs-legacy-forge-1.20.1.jar \
            build/resource-prune-report.txt \
            --draft \
            --title "Legacy CI build #${GITHUB_RUN_NUMBER}" \
            --target "$GITHUB_SHA" \
            --notes "Automated draft build from branch binary-prune/legacy. Source commit: $GITHUB_SHA. Structurally validated CI build; not a final public release. Minecraft runtime acceptance testing is still required."

          while IFS= read -r old_tag; do
            [ -n "$old_tag" ] || continue
            [ "$old_tag" = "$TAG" ] && continue
            gh release delete "$old_tag" --yes
          done < <(
            gh release list --limit 100 --json tagName,isDraft \
              --jq '.[] | select(.isDraft == true and (.tagName | startswith("legacy-auto-"))) | .tagName'
          )

