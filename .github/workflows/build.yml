name: Forge 1.20.1 Legacy Rebuild

on:
  push:
    branches:
      - rebuild/forge-1.20.1-clean
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ad-no-bs-legacy-rebuild
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout AD-NO-BS
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Checkout original binary source
        uses: actions/checkout@v4
        with:
          repository: Xinees/AD-NO-BS-Transfer
          ref: main
          path: transfer

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Gradle 8.8
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-8.8-bin.zip -o /tmp/gradle-8.8-bin.zip
          unzip -q /tmp/gradle-8.8-bin.zip -d "$HOME"
          echo "$HOME/gradle-8.8/bin" >> "$GITHUB_PATH"

      - name: Verify exact source inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s transfer/ec_ad-forge-1.20.1-1.0.4.jar
          test -s astemirlib_re-1.20.1-forge-1.2.98-SNAPSHOT.jar
          sha256sum transfer/ec_ad-forge-1.20.1-1.0.4.jar astemirlib_re-1.20.1-forge-1.2.98-SNAPSHOT.jar

      - name: Restore decompiled sources
        run: gradle --no-daemon recoverSources -PforceRecover

      - name: Apply Legacy registration filter
        run: python3 tools/prune_legacy.py

      - name: Commit reproducible Legacy source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java src/main/resources
          if ! git diff --cached --quiet; then
            git commit -m "Narrow recovered project to original Legacy creatures"
            git fetch origin "${{ github.ref_name }}"
            git rebase "origin/${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Build Legacy mod
        run: gradle --no-daemon clean build

      - name: Upload mod and diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archies-dinosaurs-legacy-forge-1.20.1-${{ github.run_number }}
          path: |
            build/libs/*.jar
            build/reports/**
          if-no-files-found: warn
          retention-days: 14
