name: Legacy source diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - binary-prune/legacy

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout legacy workspace
        uses: actions/checkout@v4
        with:
          ref: binary-prune/legacy
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Decompile original Lushsaur and Chorusoatl AI for source audit
        shell: bash
        run: |
          set -euo pipefail
          JAR="ec_ad-forge-1.20.1-1.0.4.jar"
          CFR="build/cfr-0.152.jar"
          mkdir -p build
          curl --fail --location --retry 3 \
            "https://repo.maven.apache.org/maven2/org/benf/cfr/0.152/cfr-0.152.jar" \
            -o "$CFR"
          java -jar "$CFR" "$JAR" --outputdir build/decompiled --silent true
          BASE="build/decompiled/com/eternal_creations/archies_dino_mod/common/entity/mob"
          test -d "$BASE/lushsaur"
          test -d "$BASE/chorusoatl"
          mkdir -p build/ai-audit
          cp -R "$BASE/lushsaur" build/ai-audit/
          cp -R "$BASE/chorusoatl" build/ai-audit/
          cp "build/decompiled/com/eternal_creations/archies_dino_mod/client/ADKeyMappings.java" build/ai-audit/ 2>/dev/null || true
          mkdir -p build/ai-audit/resources
          jar tf "$JAR" | grep -E 'loot_tables/entities/(lushsaur|chorusoatl|sculksaur)\.json            common/entity/base/Mount.java \
            common/entity/base/Pet.java \
            common/entity/base/ActionTargetEntity.java \
            common/entity/base/ActionTargetBlock.java \
            common/entity/component/EntityComponent.java \
            common/entity/component/EntityComponentHolder.java \
            networking \
            common/networking \
            mixin \
            client/animation/player/riding; do
            source="build/decompiled/com/eternal_creations/archies_dino_mod/$relative"
            if [[ -d "$source" ]]; then
              mkdir -p "build/ai-audit/$(dirname "$relative")"
              cp -R "$source" "build/ai-audit/$(dirname "$relative")/"
            elif [[ -f "$source" ]]; then
              mkdir -p "build/ai-audit/$(dirname "$relative")"
              cp "$source" "build/ai-audit/$relative"
            fi
          done
          grep -R -n --include='*.java' -F 'isNoPassengerCooldown()' build/decompiled/com/eternal_creations/archies_dino_mod \
            | grep -v '/MountComponent.java:' > build/ai-audit/mount-control-references.txt || true
          grep -R -n --include='*.java' -E 'isRiddenByOwner|canBeControlledByRider|tickRidden\(' \
            build/decompiled/com/eternal_creations/archies_dino_mod \
            > build/ai-audit/rider-control-references.txt || true
          for relative in \
            common/entity/ai/goal/GoalAvoidEntity.java \
            common/entity/ai/goal/GoalStrollLandAndAir.java \
            common/entity/ai/goal/GoalHurtByTarget.java \
            common/entity/ai/goal/action/GoalRandomAction.java \
            common/entity/ai/goal/action/GoalActionMeleeAttack.java \
            common/entity/ai/goal/action/GoalChargeMeleeAttack.java \
            common/entity/ai/goal/action/GoalFlyMeleeAttack.java \
            common/entity/base/AbstractComplexMob.java \
            common/entity/base/AbstractComplexMount.java \
            common/entity/component/EntityComponentHolder.java \
            common/entity/component/PetComponent.java \
            common/entity/component/MountComponent.java \
            common/entity/ADEntityTypes.java \
            client/model/render/entity/mob/LushsaurClient.java \
            client/model/render/entity/mob/ChorusoatlClient.java \
            common/entity/ai/control/SmoothMoveControl.java \
            common/entity/ai/control/SmoothLookControl.java; do
            source="build/decompiled/com/eternal_creations/archies_dino_mod/$relative"
            if [[ -f "$source" ]]; then
              mkdir -p "build/ai-audit/$(dirname "$relative")"
              cp "$source" "build/ai-audit/$relative"
            fi
          done
          find build/ai-audit -type f -name '*.java' -print | sort
          tar -czf build/ai-audit-source.tar.gz -C build/ai-audit .

      - name: Upload decompiled AI source audit
        uses: actions/upload-artifact@v4
        with:
          name: original-dinosaur-ai-source
          path: build/ai-audit-source.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Inspect vanilla SaddleItem and Saddleable bytecode
        shell: bash
        run: |
          set -euo pipefail
          CLIENT_JAR="/tmp/minecraft-1.20.1-client.jar"
          curl --fail --location --silent --show-error \
            "https://piston-data.mojang.com/v1/objects/0c3ec587af28e5a785c0b4a7b8a30f9a8f78f838/client.jar" \
            -o "$CLIENT_JAR"
          echo '===== VANILLA SADDLE ITEM ====='
          javap -classpath "$CLIENT_JAR" -p -c -s cgs
          echo '===== VANILLA SADDLEABLE INTERFACE ====='
          javap -classpath "$CLIENT_JAR" -p -c -s bgq
          echo '===== VANILLA ITEM BASE ====='
          javap -classpath "$CLIENT_JAR" -p -c -s cgm
          sha1sum "$CLIENT_JAR"

      - name: Trace Lushsaur interactions after vanilla item use
        shell: bash
        run: |
          set -euo pipefail
          JAR="ec_ad-forge-1.20.1-1.0.4.jar"
          echo '===== ABSTRACT COMPLEX MOB ====='
          javap -classpath "$JAR" -p -c com.eternal_creations.archies_dino_mod.common.entity.base.AbstractComplexMob
          echo '===== ENTITY COMPONENT HOLDER ====='
          javap -classpath "$JAR" -p -c com.eternal_creations.archies_dino_mod.common.entity.component.EntityComponentHolder
          echo '===== PET COMPONENT ====='
          javap -classpath "$JAR" -p -c com.eternal_creations.archies_dino_mod.common.entity.component.PetComponent
          echo '===== ALL INTERACTION-RELATED COMPONENT CLASSES ====='
          jar tf "$JAR" | grep 'common/entity/component/.*Component.class' | sort
          echo '===== INTERACTION REFERENCES IN RETAINED CLASS CONSTANT POOLS ====='
          for class in \
            com.eternal_creations.archies_dino_mod.common.entity.component.EntityComponentHolder \
            com.eternal_creations.archies_dino_mod.common.entity.component.PetComponent \
            com.eternal_creations.archies_dino_mod.common.entity.base.AbstractComplexMob \
            com.eternal_creations.archies_dino_mod.common.entity.base.AbstractComplexMount; do
            javap -classpath "$JAR" -p -c "$class" | grep -E -B8 -A12 \
              'mobInteract|interactFromPart|eatFromHand|equipSaddle|setSaddled|DINO_EQUIP|m_150930_|m_41622_|m_41619_' || true
          done

      - name: Inspect original egg hatching and passenger rendering
        shell: bash
        run: |
          set -euo pipefail
          JAR="ec_ad-forge-1.20.1-1.0.4.jar"
          echo '===== CHORUSOATL EGG CLASS ====='
          javap -classpath "$JAR" -p -c com.eternal_creations.archies_dino_mod.common.block.eggs.ChorusoatlEggBlock
          echo '===== EGG BASE CLASS ====='
          javap -classpath "$JAR" -p -c com.eternal_creations.archies_dino_mod.common.block.eggs.DinoEggBlock || true
          echo '===== ORIGINAL MIXIN CONFIGURATIONS ====='
          unzip -p "$JAR" ec_ad.mixins.json
          unzip -p "$JAR" ec_ad.forge.mixins.json
          echo '===== CLIENT MIXIN CLASSES ====='
          jar tf "$JAR" | grep "mixin/client/" | grep "Mixin.class" | sort || true
          echo '===== BLOCK TAG DEFINITIONS ====='
          javap -classpath "$JAR" -p -c 'com.eternal_creations.archies_dino_mod.common.ADTags$Blocks'
          echo '===== DIMENSION TAG DEFINITIONS ====='
          javap -classpath "$JAR" -p -c 'com.eternal_creations.archies_dino_mod.common.ADTags$DimensionTypes'
          echo '===== DATA TAG RESOURCES ====='
          for resource in $(jar tf "$JAR" | grep "data/ec_ad/tags/"); do
            echo "===== $resource ====="
            unzip -p "$JAR" "$resource"
          done
          echo '===== LIVING ENTITY RENDERER MIXIN ====='
          javap -classpath "$JAR" -p -c -v com.eternal_creations.archies_dino_mod.mixin.client.LivingEntityRendererMixin
          echo '===== LEVEL RENDERER MIXIN ====='
          javap -classpath "$JAR" -p -c -v com.eternal_creations.archies_dino_mod.mixin.client.LevelRendererMixin
          echo '===== PLAYER MIXIN ====='
          javap -classpath "$JAR" -p -c -v com.eternal_creations.archies_dino_mod.mixin.PlayerMixin
          echo '===== LOCAL PLAYER MIXIN ====='
          javap -classpath "$JAR" -p -c -v com.eternal_creations.archies_dino_mod.mixin.client.LocalPlayerMixin
          echo '===== LUSHSAUR ENTITY ====='
          javap -classpath "$JAR" -p -c com.eternal_creations.archies_dino_mod.common.entity.mob.lushsaur.LushsaurEntity
          echo '===== ABSTRACT COMPLEX MOUNT ====='
          javap -classpath "$JAR" -p -c com.eternal_creations.archies_dino_mod.common.entity.base.AbstractComplexMount
          echo '===== MOUNT COMPONENT ====='
          javap -classpath "$JAR" -p -c com.eternal_creations.archies_dino_mod.common.entity.component.MountComponent
          echo '===== MOUNT INTERFACE ====='
          javap -classpath "$JAR" -p -c com.eternal_creations.archies_dino_mod.common.entity.base.Mount
          echo '===== PASSENGER LAYER ====='
          javap -classpath "$JAR" -p -c com.eternal_creations.archies_dino_mod.client.model.render.entity.layer.PassengerLayer
          echo '===== LUSHSAUR CLIENT ====='
          javap -classpath "$JAR" -p -c com.eternal_creations.archies_dino_mod.client.model.render.entity.mob.LushsaurClient
          echo '===== CHORUSOATL CLIENT ====='
          javap -classpath "$JAR" -p -c com.eternal_creations.archies_dino_mod.client.model.render.entity.mob.ChorusoatlClient
          echo '===== ENTITY REGISTRY DEFINITIONS ====='
          javap -classpath "$JAR" -p -c com.eternal_creations.archies_dino_mod.common.entity.ADEntityTypes
          echo '===== RESOURCE SUPPLIER ====='
          javap -classpath "$JAR" -p -c com.eternal_creations.archies_dino_mod.util.ResourceSupplier
          echo '===== MOD METADATA ====='
          echo '===== PLATFORM CLASSES ====='
          jar tf "$JAR" | grep -F 'platform/' | sort || true
          echo '===== COMMON HELPER INTERFACE ====='
          javap -classpath "$JAR" -p -c com.eternal_creations.archies_dino_mod.platform.services.ICommonHelper || true
          echo '===== FORGE COMMON HELPER IMPLEMENTATION ====='
          javap -classpath "$JAR" -p -c com.eternal_creations.archies_dino_mod.platform.ForgeCommonHelper || true
          echo '===== MOD METADATA ====='
          unzip -p "$JAR" META-INF/mods.toml > build/ai-audit/original-entity-loot-entries.txt || true
          while IFS= read -r entry; do
            [[ -n "$entry" ]] || continue
            mkdir -p "build/ai-audit/resources/$(dirname "$entry")"
            unzip -p "$JAR" "$entry" > "build/ai-audit/resources/$entry"
          done < build/ai-audit/original-entity-loot-entries.txt
          for relative in \
            common/entity/base/Mount.java \
            common/entity/base/Pet.java \
            common/entity/base/ActionTargetEntity.java \
            common/entity/base/ActionTargetBlock.java \
            common/entity/component/EntityComponent.java \
            common/entity/component/EntityComponentHolder.java \
            networking \
            common/networking \
            mixin \
            client/animation/player/riding; do
            source="build/decompiled/com/eternal_creations/archies_dino_mod/$relative"
            if [[ -d "$source" ]]; then
              mkdir -p "build/ai-audit/$(dirname "$relative")"
              cp -R "$source" "build/ai-audit/$(dirname "$relative")/"
            elif [[ -f "$source" ]]; then
